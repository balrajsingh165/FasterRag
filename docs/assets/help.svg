<svg xmlns="http://www.w3.org/2000/svg" width="1388" height="872" viewBox="0 0 1388 872" role="img" aria-label="fasterrag --help"><title>fasterrag --help</title><rect width="1388" height="872" rx="10" fill="#11131a"/><rect width="1388" height="44" rx="10" fill="#1b1e27"/><rect y="34" width="1388" height="10" fill="#1b1e27"/><circle cx="20" cy="22" r="6" fill="#ff5f57"/><circle cx="38" cy="22" r="6" fill="#febc2e"/><circle cx="56" cy="22" r="6" fill="#28c840"/><text x="694" y="27" fill="#6b7693" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">fasterrag --help</text><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><text x="22.0" y="52.0" fill="#8fe39a" xml:space="preserve">$ fasterrag --help</text><text x="22.0" y="71.0" fill="#c9d2e3" xml:space="preserve"></text><text x="22.0" y="90.0" fill="#7fd1ff" xml:space="preserve">usage: fasterrag [-h] [--config CONFIG] [--collection COLLECTION]</text><text x="22.0" y="109.0" fill="#c9d2e3" xml:space="preserve">                 [--set KEY=VALUE] [--json] [--quiet] [--verbose]</text><text x="22.0" y="128.0" fill="#c9d2e3" xml:space="preserve">                 {serve,worker,ingest,query,index,provision,status,doctor,ci-status,estimate,autopilot,backup,restore,benchmark,replay,traces,export,import,config} ...</text><text x="22.0" y="147.0" fill="#c9d2e3" xml:space="preserve"></text><text x="22.0" y="166.0" fill="#c9d2e3" xml:space="preserve">Backend-only RAG framework. See docs/cli-reference.md.</text><text x="22.0" y="185.0" fill="#c9d2e3" xml:space="preserve"></text><text x="22.0" y="204.0" fill="#f0c674" xml:space="preserve">positional arguments:</text><text x="22.0" y="223.0" fill="#c9d2e3" xml:space="preserve">  {serve,worker,ingest,query,index,provision,status,doctor,ci-status,estimate,autopilot,backup,restore,benchmark,replay,traces,export,import,config}</text><text x="22.0" y="242.0" fill="#c9d2e3" xml:space="preserve">    serve               run the API server</text><text x="22.0" y="261.0" fill="#c9d2e3" xml:space="preserve">    worker              run the pipeline worker pools</text><text x="22.0" y="280.0" fill="#c9d2e3" xml:space="preserve">    ingest              submit sources for ingestion</text><text x="22.0" y="299.0" fill="#c9d2e3" xml:space="preserve">    query               run a query</text><text x="22.0" y="318.0" fill="#c9d2e3" xml:space="preserve">    index               manage collections</text><text x="22.0" y="337.0" fill="#c9d2e3" xml:space="preserve">    provision           config-driven provisioning</text><text x="22.0" y="356.0" fill="#c9d2e3" xml:space="preserve">    status              one-screen system status</text><text x="22.0" y="375.0" fill="#c9d2e3" xml:space="preserve">    doctor              preflight diagnostics (D10)</text><text x="22.0" y="394.0" fill="#c9d2e3" xml:space="preserve">    ci-status           fail when any workflow&#x27;s last conclusion on a branch</text><text x="22.0" y="413.0" fill="#c9d2e3" xml:space="preserve">                        is red</text><text x="22.0" y="432.0" fill="#c9d2e3" xml:space="preserve">    estimate            preflight cost estimate</text><text x="22.0" y="451.0" fill="#c9d2e3" xml:space="preserve">    autopilot           eval-driven tuning that only suggests (D6)</text><text x="22.0" y="470.0" fill="#c9d2e3" xml:space="preserve">    backup              capture a full deployment backup</text><text x="22.0" y="489.0" fill="#c9d2e3" xml:space="preserve">    restore             restore a deployment from a backup</text><text x="22.0" y="508.0" fill="#c9d2e3" xml:space="preserve">    benchmark           run the benchmark suites</text><text x="22.0" y="527.0" fill="#c9d2e3" xml:space="preserve">    replay              re-execute a past query (D8)</text><text x="22.0" y="546.0" fill="#c9d2e3" xml:space="preserve">    traces              inspect stored query traces</text><text x="22.0" y="565.0" fill="#c9d2e3" xml:space="preserve">    export              write a collection to a portable archive</text><text x="22.0" y="584.0" fill="#c9d2e3" xml:space="preserve">    import              import a portable archive</text><text x="22.0" y="603.0" fill="#c9d2e3" xml:space="preserve">    config              configuration tools</text><text x="22.0" y="622.0" fill="#c9d2e3" xml:space="preserve"></text><text x="22.0" y="641.0" fill="#f0c674" xml:space="preserve">options:</text><text x="22.0" y="660.0" fill="#6b7693" xml:space="preserve">  -h, --help            show this help message and exit</text><text x="22.0" y="679.0" fill="#6b7693" xml:space="preserve">  --config CONFIG       config file to load</text><text x="22.0" y="698.0" fill="#6b7693" xml:space="preserve">  --collection COLLECTION</text><text x="22.0" y="717.0" fill="#c9d2e3" xml:space="preserve">                        target collection</text><text x="22.0" y="736.0" fill="#6b7693" xml:space="preserve">  --set KEY=VALUE       override any config.yaml setting, e.g. --set</text><text x="22.0" y="755.0" fill="#c9d2e3" xml:space="preserve">                        chunking.chunk_size=512 (repeatable; validated exactly</text><text x="22.0" y="774.0" fill="#c9d2e3" xml:space="preserve">                        as a file value is)</text><text x="22.0" y="793.0" fill="#6b7693" xml:space="preserve">  --json                JSON output</text><text x="22.0" y="812.0" fill="#6b7693" xml:space="preserve">  --quiet, -q           errors only</text><text x="22.0" y="831.0" fill="#6b7693" xml:space="preserve">  --verbose, -v         debug logging</text></g></svg>
