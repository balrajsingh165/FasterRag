<svg xmlns="http://www.w3.org/2000/svg" width="793" height="606" viewBox="0 0 793 606" role="img" aria-label="fasterrag index --help"><title>fasterrag index --help</title><rect width="793" height="606" rx="10" fill="#11131a"/><rect width="793" height="44" rx="10" fill="#1b1e27"/><rect y="34" width="793" height="10" fill="#1b1e27"/><circle cx="20" cy="22" r="6" fill="#ff5f57"/><circle cx="38" cy="22" r="6" fill="#febc2e"/><circle cx="56" cy="22" r="6" fill="#28c840"/><text x="396" y="27" fill="#6b7693" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">fasterrag index --help</text><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><text x="22.0" y="52.0" fill="#8fe39a" xml:space="preserve">$ fasterrag index --help</text><text x="22.0" y="71.0" fill="#c9d2e3" xml:space="preserve"></text><text x="22.0" y="90.0" fill="#7fd1ff" xml:space="preserve">usage: fasterrag index [-h] [--config CONFIG] [--collection COLLECTION]</text><text x="22.0" y="109.0" fill="#c9d2e3" xml:space="preserve">                       [--set KEY=VALUE] [--json] [--quiet] [--verbose]</text><text x="22.0" y="128.0" fill="#c9d2e3" xml:space="preserve">                       {list,create,delete,reembed,rollback,tenants,backfill-tenant,lock} ...</text><text x="22.0" y="147.0" fill="#c9d2e3" xml:space="preserve"></text><text x="22.0" y="166.0" fill="#f0c674" xml:space="preserve">positional arguments:</text><text x="22.0" y="185.0" fill="#c9d2e3" xml:space="preserve">  {list,create,delete,reembed,rollback,tenants,backfill-tenant,lock}</text><text x="22.0" y="204.0" fill="#c9d2e3" xml:space="preserve">    list                collections with vector counts and model</text><text x="22.0" y="223.0" fill="#c9d2e3" xml:space="preserve">    create              create a collection</text><text x="22.0" y="242.0" fill="#c9d2e3" xml:space="preserve">    delete              drop a collection</text><text x="22.0" y="261.0" fill="#c9d2e3" xml:space="preserve">    reembed             blue/green re-embed with an eval gate (D2)</text><text x="22.0" y="280.0" fill="#c9d2e3" xml:space="preserve">    rollback            flip the alias back to a retained build (D2)</text><text x="22.0" y="299.0" fill="#c9d2e3" xml:space="preserve">    tenants             count points by tenant payload tag</text><text x="22.0" y="318.0" fill="#c9d2e3" xml:space="preserve">    backfill-tenant     write the tenant payload tag onto existing points</text><text x="22.0" y="337.0" fill="#c9d2e3" xml:space="preserve">    lock                index lockfile operations (D1)</text><text x="22.0" y="356.0" fill="#c9d2e3" xml:space="preserve"></text><text x="22.0" y="375.0" fill="#f0c674" xml:space="preserve">options:</text><text x="22.0" y="394.0" fill="#6b7693" xml:space="preserve">  -h, --help            show this help message and exit</text><text x="22.0" y="413.0" fill="#6b7693" xml:space="preserve">  --config CONFIG       config file to load</text><text x="22.0" y="432.0" fill="#6b7693" xml:space="preserve">  --collection COLLECTION</text><text x="22.0" y="451.0" fill="#c9d2e3" xml:space="preserve">                        target collection</text><text x="22.0" y="470.0" fill="#6b7693" xml:space="preserve">  --set KEY=VALUE       override any config.yaml setting, e.g. --set</text><text x="22.0" y="489.0" fill="#c9d2e3" xml:space="preserve">                        chunking.chunk_size=512 (repeatable; validated exactly</text><text x="22.0" y="508.0" fill="#c9d2e3" xml:space="preserve">                        as a file value is)</text><text x="22.0" y="527.0" fill="#6b7693" xml:space="preserve">  --json                JSON output</text><text x="22.0" y="546.0" fill="#6b7693" xml:space="preserve">  --quiet, -q           errors only</text><text x="22.0" y="565.0" fill="#6b7693" xml:space="preserve">  --verbose, -v         debug logging</text></g></svg>
