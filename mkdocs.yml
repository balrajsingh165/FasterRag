site_name: fasterRag
site_url: https://docs-fasterrag.fortiqo.xyz/
site_author: Balraj
site_description: >-
  fasterRag is a backend-only, API-and-CLI Retrieval-Augmented Generation framework built on
  FastAPI. Pluggable vector databases, embedding models and LLM providers chosen entirely
  through configuration, with a typed error taxonomy, hybrid retrieval, blue/green re-embedding
  and an observability dashboard that never controls the system.
repo_url: https://github.com/balrajsingh165/fasterrag
repo_name: balrajsingh165/fasterrag
edit_uri: edit/main/userdocs/
copyright: Apache-2.0 licensed. Every performance claim on this site is a goal unless it links to the benchmark ledger.

# CRITICAL: the site is built from userdocs/, a short user-facing set, and never from docs/.
# docs/ is the engineering record: it holds todo.md and blockers.md, which describe unfixed
# security findings in enough detail to act on and must not be published, and dozens of
# documents a user does not need. Pointing docs_dir back at docs/ publishes all of it.
# tests/unit/docs/test_site_pages.py keeps every userdocs page in the nav and free of task ids.
docs_dir: userdocs

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/logo-mono.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/balrajsingh165/fasterrag
      name: fasterRag on GitHub
  generator: false

extra_css:
  - assets/extra.css
  - assets/intro.css

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Configuration: configuration.md
  - CLI: cli.md
  - REST API: rest-api.md
  - Python: python.md
  - Providers & deployment: providers.md
  - Troubleshooting: troubleshooting.md
