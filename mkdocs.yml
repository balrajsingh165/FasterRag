site_name: fasterRag
site_url: https://docs-fasterrag.fortiqo.xyz/
site_author: Balraj
site_description: >-
  fasterRag is a backend-only, API-and-CLI Retrieval-Augmented Generation framework built on
  FastAPI. Pluggable vector databases, embedding models and LLM providers chosen entirely
  through configuration, with a typed error taxonomy, hybrid retrieval, blue/green re-embedding
  and an observability dashboard that never controls the system.
repo_url: https://github.com/balrajsingh165/fasterrag
repo_name: balrajsingh165/fasterrag
edit_uri: edit/main/docs/
copyright: Apache-2.0 licensed. Every performance claim on this site is a goal unless it links to the benchmark ledger.

# CRITICAL: todo.md and blockers.md are excluded from the build, not merely left out of the
# nav. A page absent from the nav is still rendered and indexed by mkdocs. Those two files
# describe unfixed security findings in enough detail to act on, and must not be published
# until the findings they name are closed.
exclude_docs: |
  todo.md
  blockers.md
  code-notes.md
  engineering-scorecard.md
  engineering-audit.md
  task-briefs.md

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/logo-mono.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/balrajsingh165/fasterrag
      name: fasterRag on GitHub
  generator: false

extra_css:
  - assets/extra.css
  - assets/intro.css

not_in_nav: |
  references.md
  glossary.md
  data-model.md
  prompts.md
  archive-format.md
  structure.md
  flow.md
  internals.md
  reliability.md
  failure-modes.md
  slo.md
  disaster-recovery.md
  benchmarks.md
  performance.md
  testing-strategy.md
  verification.md
  release-readiness.md
  rebuild-playbook.md
  scope.md
  differentiators.md
  release.md
  adr/*.md

# CRITICAL: the navigation is deliberately short. It lists what someone using fasterRag needs:
# how to start, the four references, how it works, how to run it. The design, reliability,
# evidence and process documents are still built and still linked - from engineering-notes.md
# and from each other - but they are not in the sidebar, because a reader who has to scan forty
# entries to find the quickstart does not find it.
nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - User guide: how-to-use.md
      - Configuration recipes: cookbook.md
      - Troubleshooting: troubleshooting.md
      - Coming from another framework: migration-guide.md
  - Reference:
      - REST API: api-reference.md
      - CLI: cli-reference.md
      - Configuration: config-reference.md
      - Python package: python-api.md
      - Writing a plugin: plugins.md
  - How it works:
      - Visual tour: tour.md
      - Architecture: architecture.md
      - Integrations: integrations.md
  - Run it:
      - Deployment: deployment.md
      - Security: security.md
      - Observability: observability.md
  - Project:
      - Changelog: CHANGELOG.md
      - Contributing: CONTRIBUTING.md
      - Engineering notes: engineering-notes.md
