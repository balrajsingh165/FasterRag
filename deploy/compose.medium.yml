# Sizing preset: ~1M–50M chunks (docs/deployment.md §4).
#
# A separate database host is recommended at this scale; if Qdrant moves off this machine,
# drop the `qdrant` profile and set `vector_db.mode: external` with its address.
#
#   docker compose -f docker-compose.yml -f deploy/compose.medium.yml --profile core up -d
#
# Planning defaults, not measurements (docs/benchmarks.md, TASK-0084).
#
# The pools run inside the API process, because ingestion does; there is no separate worker
# service to size (TASK-0130). The API's limits are what the API and the removed worker
# service were given between them.
#
# CRITICAL: every FASTERRAG_SET below repeats `vector_db.host=qdrant` from the base file.
# Compose merges `environment` per key, so setting FASTERRAG_SET here replaces the base value
# rather than extending it, and dropping the host sends the API at its own localhost.

services:
  api:
    # cpu_pool_size=0 means "one per core", which is what the schema documents.
    environment:
      FASTERRAG_SET: vector_db.host=qdrant,workers.cpu_pool_size=0,workers.embedding_pool_size=2
    deploy:
      resources:
        limits:
          cpus: "12"
          memory: 20G

  qdrant:
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 32G
