# fasterRag configuration — drives ALL behavior. Contains NO secrets by policy:
# secrets live in .env and are referenced here by environment-variable NAME only.
# This file is the canonical default configuration and MUST stay byte-consistent with
# the complete example in docs/config-reference.md (drift between the two is a bug).
# Every integration toggle defaults to false.

app:
  host: 127.0.0.1
  port: 8000
  log_level: info

vector_db:
  provider: qdrant
  mode: docker
  host: localhost
  port: 6333
  grpc_port: 6334
  prefer_grpc: false
  https: false
  api_key_env: QDRANT_API_KEY
  docker:
    image: qdrant/qdrant:v1.18.1
    volume: fasterrag_qdrant_storage
  collection:
    default_name: default
    distance: cosine
    shard_number: 1
    replication_factor: 1
  pgvector:
    dsn_env: null
    db_schema: fasterrag
    pool_max_size: 8
    maintenance_timeout_ms: 600000
  chroma:
    path: .fasterrag/chroma
    batch_size: 1000

embeddings:
  provider: huggingface
  model: BAAI/bge-small-en-v1.5
  api_key_env: null
  batch_size: 64
  dimensions: null
  cache:
    enabled: true
    backend: disk
    max_entries: 10000
    redis_url: redis://localhost:6379/0
  tiering:
    enabled: false
    rules: []

llm:
  provider: openai
  model: gpt-4o-mini
  api_key_env: OPENAI_API_KEY
  base_url: null
  temperature: 0.1
  max_tokens: 1024
  streaming: true

parsing:
  minimum_chars_per_page: 40
  ocr_resolution: 200
  heading_size_ratio: 1.15
  max_heading_chars: 120
  rows_per_block: 20

chunking:
  strategy: recursive
  chunk_size: 768
  overlap: 64
  token_counter: auto
  chars_per_token: 4
  semantic_percentile: 0.95
  contextual_enrichment: false
  context_tokens: 75

retrieval:
  top_k: 10
  hybrid: true
  bm25_weight: 1.0
  dense_weight: 1.0
  rrf_k: 60
  bm25_k1: 1.2
  bm25_b: 0.75
  rerank: true
  reranker_model: BAAI/bge-reranker-v2-m3
  rerank_top_n: 100

generation:
  grounded_or_refuse: false
  faithfulness_threshold: 0.7
  citations: true
  context_budget_tokens: 4000

cache:
  semantic: false
  similarity_threshold: 0.95
  ttl: 3600
  backend: memory
  max_entries: 10000
  redis_url: redis://localhost:6379/0

workers:
  cpu_pool_size: 0
  embedding_pool_size: 1
  queue_depth: 1000

ingestion:
  dedup: true
  journal:
    enabled: true
    checkpoint_every: 100
  dlq:
    enabled: true
    max_retries: 3
  max_document_mb: 100
  # Seconds one document may spend being parsed and chunked before it is
  # dead-lettered as PARSE_TIMEOUT and its worker is replaced. 0 = no limit.
  parse_timeout_seconds: 600
  # Directories a `path` source may read from. Empty is unconfined, which is
  # refused outright once security.auth is on -- see docs/security.md.
  allowed_source_roots: []

index:
  lockfile: true
  reindex:
    strategy: blue_green
    eval_gate: true
    rollback_retention_hours: 72

reliability:
  timeouts:
    vector_db_ms: 5000
    embeddings_ms: 30000
    llm_ms: 120000
    redis_ms: 1000
  retries:
    max_attempts: 3
    backoff_base_ms: 250
    backoff_max_ms: 10000
    jitter: true
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    reset_timeout_ms: 30000
  idempotency:
    enabled: true
    ttl_seconds: 86400
    in_flight_lease_seconds: 900
  shutdown_grace_seconds: 20
  stale_job_seconds: 120

traces:
  store: true
  retention_days: 30
  replay: true

cost:
  estimator: true
  per_query_token_budget: 0
  per_tenant_token_budget: 0

autopilot:
  enabled: false
  golden_set_size: 100

eval:
  regression_gate: false
  recall_tolerance: 0.02
  ndcg_tolerance: 0.02

observability:
  dashboard: false
  dashboard_port: 8080
  otel: false
  otel_endpoint: null
  langfuse: false
  grafana: false

security:
  auth: false
  api_key_env: FASTERRAG_API_KEY
  multi_tenancy: false
  tenant_header: X-Tenant-ID
  # Push the caller's tenant into both retrieval legs as a mandatory filter. Requires auth
  # and multi_tenancy. Off by default: chunks indexed before multi_tenancy was enabled
  # carry no tenant field, and an absent field never matches -- see docs/security.md.
  tenant_scoped_retrieval: false
  rate_limit_per_minute: 600
  rate_limit_backend: memory
  rate_limit_redis_url: redis://localhost:6379/0
  max_request_mb: 25
  # Directories admin export may write into and admin import may read from. Empty is
  # unconfined, which is refused outright once auth is on -- see docs/security.md.
  allowed_archive_roots: []
