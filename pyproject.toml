[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fasterrag"
dynamic = ["version"]
description = "Backend-only, all-in-one Retrieval-Augmented Generation framework engineered for very large datasets."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "fasterRag maintainers" }]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "vector-database",
    "embeddings",
    "fastapi",
    "qdrant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The core install is the library: configuration, chunking, Markdown/text/CSV/JSON parsing,
# BM25 and fusion, the facade and the CLI. The web server, the Qdrant client and the PDF,
# DOCX and HTML parsers are extras (TASK-0444); each is imported only where it is used, and
# a missing one fails with an error naming the extra to install.
#
# Every requirement a user installs is capped below the next major release of the package,
# because that major has not been tested here (TASK-0556): an uncapped httpx let
# `pip install --pre` take 1.0.dev6 and every CLI command failed at import. For a 0.x package
# the cap is 1.0. Raise a cap only together with a run of the suite against the new major;
# tests/unit/scripts/test_check_package.py fails on a requirement with no upper bound.
dependencies = [
    "httpx>=0.27,<1",
    "markdown-it-py>=3.0,<5",
    "psutil>=6.0,<8",
    "pydantic>=2.8,<3",
    "pydantic-settings[yaml]>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "snowballstemmer>=2.2,<4",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
qdrant = ["qdrant-client>=1.9,<2"]
pdf = ["pdfplumber>=0.11,<1"]
docx = ["python-docx>=1.1,<2"]
html = ["beautifulsoup4>=4.12,<5", "lxml>=5.0,<7"]
ocr = [
    "pdfplumber>=0.11,<1",
    "pillow>=10.0,<14",
    "pytesseract>=0.3.10,<1",
]
huggingface = ["sentence-transformers>=3.0,<7"]
rerank = ["sentence-transformers>=3.0,<7"]
openai = ["openai>=1.40,<4"]
anthropic = ["anthropic>=0.40,<3"]
# Both floors are measured, not guessed (TASK-0441): the recorded responses in
# tests/unit/adapters/recordings.py were replayed through each release named here. The
# Cohere generator needs AsyncClientV2, which 5.6.2 does not have and 5.8.0 does, and it
# builds it with `max_retries=0`, which AsyncClientV2 accepts from 7.0.5 (7.0.4 raises
# TypeError; the recorded-response suites pass on 7.0.5, re-measured 2026-11-15). The Ollama
# adapters read the typed responses 0.4.0 introduced; 0.3.3 returns plain dicts and fails.
cohere = ["cohere>=7.0.5,<8"]
ollama = ["ollama>=0.4,<1"]
redis = ["redis>=5.0,<9"]
pgvector = ["psycopg[binary,pool]>=3.2,<4", "pgvector>=0.3,<1"]
chroma = ["chromadb>=1.5,<2"]
milvus = ["pymilvus>=3.0,<4"]
# The upper bound is not caution, it is history: weaviate-client 3 and 4 share a name and
# nothing else, and the adapter is written against the v4 collections API. A v5 that
# repeats that rewrite would import cleanly and fail at the first call.
weaviate = ["weaviate-client>=4.24,<5"]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
]
# TASK-0551: the adapter contract suite, fasterrag.testing, runs under pytest. A plugin author
# installs this to run it against their plugin; a deployment never needs it, so it is not in `all`.
testing = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2"]
all = [
    "anthropic>=0.40,<3",
    "beautifulsoup4>=4.12,<5",
    "chromadb>=1.5,<2",
    "cohere>=7.0.5,<8",
    "fastapi>=0.115,<1",
    "lxml>=5.0,<7",
    "ollama>=0.4,<1",
    "openai>=1.40,<4",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "pdfplumber>=0.11,<1",
    "pgvector>=0.3,<1",
    "pillow>=10.0,<14",
    "psycopg[binary,pool]>=3.2,<4",
    "pymilvus>=3.0,<4",
    "pytesseract>=0.3.10,<1",
    "python-docx>=1.1,<2",
    "qdrant-client>=1.9,<2",
    "redis>=5.0,<9",
    "sentence-transformers>=3.0,<7",
    "uvicorn[standard]>=0.30,<1",
    "weaviate-client>=4.24,<5",
]
dev = [
    # CRITICAL: docs/release.md step 5 and scripts/check_package.py both shell out to
    # `python -m build`. Without it here, `pip install -e ".[dev]"` leaves a releaser and the
    # packaging gate with a tool neither of them can run.
    "build>=1.2",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "pre-commit>=3.8",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    # CRITICAL: the unit and integration CI jobs install only `.[dev]`, so the redis,
    # PostgreSQL, Chroma, Milvus, and Weaviate clients belong here as well as in their own
    # extras — without them the RedisStore, pgvector, Chroma, Milvus, and Weaviate suites
    # would skip in exactly the environment that is supposed to be gating them. fakeredis extends that
    # reasoning to a suite with no server to point at: it speaks the Redis protocol in-process to the
    # real redis-py client, so the rate-limiter integration tests run on a machine and in
    # a CI job that has no Redis. It stays dev-only and gets no extra of its own — it is a
    # test server, never something a deployment should be able to install by accident.
    # cohere and ollama are here on the same reasoning (TASK-0441): the recorded-response
    # suites in tests/unit/adapters/*/test_real_clients.py replay through the real client
    # libraries and are marked must_run, so both must be installed where the unit tier runs.
    # The server, qdrant, pdf, docx and html extras are here for the same reason: they were
    # core until TASK-0444, and the API, Qdrant and parser suites gate on them in every lane.
    "beautifulsoup4>=4.12,<5",
    "chromadb>=1.5,<2",
    "cohere>=7.0.5,<8",
    "fakeredis>=2.26",
    "fastapi>=0.115,<1",
    "lxml>=5.0,<7",
    "ollama>=0.4,<1",
    "pdfplumber>=0.11,<1",
    "pgvector>=0.3,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pymilvus>=3.0,<4",
    "python-docx>=1.1,<2",
    "qdrant-client>=1.9,<2",
    "redis>=5.0,<9",
    "reportlab>=4.0",
    "ruff>=0.6",
    "types-grpcio>=1.0",
    "types-psutil>=6.0",
    "types-pyyaml>=6.0",
    "uvicorn[standard]>=0.30,<1",
    "weaviate-client>=4.24,<5",
]

[project.scripts]
fasterrag = "fasterrag.cli.main:main"

[project.urls]
Homepage = "https://github.com/balrajsingh165/FasterRag"
Documentation = "https://github.com/balrajsingh165/FasterRag/tree/main/docs"
Source = "https://github.com/balrajsingh165/FasterRag"
Issues = "https://github.com/balrajsingh165/FasterRag/issues"
Changelog = "https://github.com/balrajsingh165/FasterRag/blob/main/docs/CHANGELOG.md"

[tool.hatch.version]
path = "src/fasterrag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fasterrag"]

# The canonical config.yaml is packaged rather than duplicated under src/. It is one file,
# byte-identical for a repository checkout and a `pip install`, so `fasterrag config init`
# cannot hand a user a template that has drifted from the documented one.
[tool.hatch.build.targets.wheel.force-include]
"config.yaml" = "fasterrag/data/config.yaml"
".env.example" = "fasterrag/data/.env.example"

# CRITICAL: the sdist keeps config.yaml at its root and does NOT relocate it. A wheel is
# built by unpacking the sdist and running the wheel target inside it, so relocating the
# file here removes it from where the wheel's force-include looks — the sdist builds, and
# then the wheel build fails with "Forced include not found".
[tool.hatch.build.targets.sdist]
include = [
    "src",
    "config.yaml",
    ".env.example",
    "README.md",
    "LICENSE",
    "NOTICE",
    "docs",
    "scripts",
    "tests",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "D",
    "E",
    "ERA",
    "F",
    "I",
    "N",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TID",
    "UP",
    "W",
]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "ARG005", "D100", "D101", "D102", "D103", "D104", "D107"]
"examples/**" = ["ARG002", "T201"]
"examples/*/tests/**" = ["D102", "D103"]
"src/fasterrag/config/schema.py" = ["ARG003"]
"src/fasterrag/cli/parser.py" = ["ARG002"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
mypy_path = "scripts"
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["fasterrag.*"]
disallow_any_unimported = true

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "cohere.*",
    "ollama.*",
    "openai.*",
    # CRITICAL: pymilvus ships no py.typed marker, so every symbol it exports is
    # untyped. Without this entry `mypy --strict` cannot even resolve the import and the
    # Milvus adapter fails the type gate; with it, the adapter must keep every pymilvus
    # value behind an explicit `Any` so `disallow_any_unimported` still has teeth.
    "pymilvus.*",
    "pytesseract.*",
    "redis.*",
    "reportlab.*",
    "sentence_transformers.*",
    "snowballstemmer.*",
    # CRITICAL: torch and transformers arrive with the `huggingface` extra, which the CI
    # quality job does not install — it installs `.[dev]`. Without these two entries mypy
    # passes for anyone whose venv happens to carry them and fails in CI, which is exactly
    # how it failed there unnoticed from 2026-08-04 (TASK-0261). Both are imported lazily,
    # inside the functions that need them, so the runtime already treats them as optional.
    "torch.*",
    "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# CRITICAL: "src" comes first, and it is what makes the suite test the checkout it is run
# from. The editable install writes an absolute path into
# site-packages/_editable_impl_fasterrag.pth, so `import fasterrag` resolves to the ORIGINAL
# checkout's src no matter the working directory. In a git worktree that means pytest runs
# the worktree's tests against main's source: a change can be committed green without its
# code ever having been executed, and the pre-commit hook runs pytest, so the gate agrees.
# pytest inserts these at the front of sys.path, which puts the local tree ahead of the .pth.
pythonpath = ["src", "scripts"]
addopts = "--strict-markers --strict-config -m 'not eval and not load and not soak and not chaos'"
asyncio_mode = "auto"
markers = [
    "integration: requires containerized backends (testcontainers)",
    "eval: retrieval eval harness over committed datasets",
    "must_run: must execute in at least one CI lane; skipped in all of them fails the build",
    "load: load-test scenarios run on reference hardware",
    "soak: long-running stability runs",
    "chaos: scripted fault-injection scenarios",
    "timeout: pytest-timeout's per-test ceiling; registered here too so a tier's opt-out parses where the plugin is absent",
]

[tool.coverage.run]
source = ["src/fasterrag"]
branch = true
# CRITICAL: coverage's default "sysmon" core does not record dynamic contexts. Under it,
# `--cov-context=test` labels only the FIRST context to enter a line, so a query for which
# tests entered a line returns zero whenever module import got there first - a clean, green
# run that measured almost nothing. Two passes of the TASK-0335 vacuity sweep were lost to
# it. COVERAGE_CORE in the environment still overrides this; see docs/testing-strategy.md
# and tests/test_coverage_records_contexts.py, which proves the pinned core labels every
# visit and that the default one still does not.
core = "ctrace"

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
