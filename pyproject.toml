[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fasterrag"
dynamic = ["version"]
description = "Backend-only, all-in-one Retrieval-Augmented Generation framework engineered for very large datasets."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "fasterRag maintainers" }]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "vector-database",
    "embeddings",
    "fastapi",
    "qdrant",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5.0",
    "markdown-it-py>=3.0",
    "pdfplumber>=0.11",
    "psutil>=6.0",
    "python-docx>=1.1",
    "pydantic>=2.8",
    "pydantic-settings[yaml]>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "qdrant-client>=1.9",
    "snowballstemmer>=2.2",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
ocr = [
    "pillow>=10.0",
    "pytesseract>=0.3.10",
]
huggingface = ["sentence-transformers>=3.0"]
rerank = ["sentence-transformers>=3.0"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
cohere = ["cohere>=5.5"]
ollama = ["ollama>=0.3"]
redis = ["redis>=5.0"]
pgvector = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
]
all = [
    "anthropic>=0.40",
    "cohere>=5.5",
    "ollama>=0.3",
    "openai>=1.40",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "pgvector>=0.3",
    "pillow>=10.0",
    "psycopg[binary]>=3.2",
    "pytesseract>=0.3.10",
    "redis>=5.0",
    "sentence-transformers>=3.0",
]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    # CRITICAL: the unit and integration CI jobs install only `.[dev]`, so the redis and
    # PostgreSQL clients belong here as well as in their own extras — without them the
    # RedisStore and pgvector suites would skip in exactly the environment that is
    # supposed to be gating them.
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "reportlab>=4.0",
    "ruff>=0.6",
    "types-grpcio>=1.0",
    "types-psutil>=6.0",
    "types-pyyaml>=6.0",
]

[project.scripts]
fasterrag = "fasterrag.cli.main:main"

[project.urls]
Homepage = "https://github.com/balrajsingh165/FasterRag"
Documentation = "https://github.com/balrajsingh165/FasterRag/tree/main/docs"
Source = "https://github.com/balrajsingh165/FasterRag"
Issues = "https://github.com/balrajsingh165/FasterRag/issues"
Changelog = "https://github.com/balrajsingh165/FasterRag/blob/main/docs/CHANGELOG.md"

[tool.hatch.version]
path = "src/fasterrag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fasterrag"]

# The canonical config.yaml is packaged rather than duplicated under src/. It is one file,
# byte-identical for a repository checkout and a `pip install`, so `fasterrag config init`
# cannot hand a user a template that has drifted from the documented one.
[tool.hatch.build.targets.wheel.force-include]
"config.yaml" = "fasterrag/data/config.yaml"
".env.example" = "fasterrag/data/.env.example"

# CRITICAL: the sdist keeps config.yaml at its root and does NOT relocate it. A wheel is
# built by unpacking the sdist and running the wheel target inside it, so relocating the
# file here removes it from where the wheel's force-include looks — the sdist builds, and
# then the wheel build fails with "Forced include not found".
[tool.hatch.build.targets.sdist]
include = [
    "src",
    "config.yaml",
    ".env.example",
    "README.md",
    "docs",
    "scripts",
    "tests",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "D",
    "E",
    "ERA",
    "F",
    "I",
    "N",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TID",
    "UP",
    "W",
]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "ARG005", "D100", "D101", "D102", "D103", "D104", "D107"]
"src/fasterrag/config/schema.py" = ["ARG003"]
"src/fasterrag/cli/parser.py" = ["ARG002"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
mypy_path = "scripts"
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["fasterrag.*"]
disallow_any_unimported = true

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "cohere.*",
    "ollama.*",
    "openai.*",
    "pytesseract.*",
    "redis.*",
    "reportlab.*",
    "sentence_transformers.*",
    "snowballstemmer.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# CRITICAL: "src" comes first, and it is what makes the suite test the checkout it is run
# from. The editable install writes an absolute path into
# site-packages/_editable_impl_fasterrag.pth, so `import fasterrag` resolves to the ORIGINAL
# checkout's src no matter the working directory. In a git worktree that means pytest runs
# the worktree's tests against main's source: a change can be committed green without its
# code ever having been executed, and the pre-commit hook runs pytest, so the gate agrees.
# pytest inserts these at the front of sys.path, which puts the local tree ahead of the .pth.
pythonpath = ["src", "scripts"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: requires containerized backends (testcontainers)",
    "eval: retrieval eval harness over committed datasets",
    "load: load-test scenarios run on reference hardware",
    "soak: long-running stability runs",
    "chaos: scripted fault-injection scenarios",
    "mutation: mutation-testing runs",
]

[tool.coverage.run]
source = ["src/fasterrag"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
