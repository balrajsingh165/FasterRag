# Local quality gates mirroring docs/testing-strategy.md §2.
# Install with: pre-commit install
# default_install_hook_types below wires both the pre-commit and commit-msg stages, so a
# single install command covers the commit-message rule too.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # uv.lock is excluded, not accommodated by raising the limit. It is ~525 KB because it
      # pins 135 packages with 1577 hashes, and that size is the feature — it is also the one
      # large file in the tree that must be committed. Raising the threshold instead would
      # weaken the guard for the binaries and datasets it actually exists to stop.
      - id: check-added-large-files
        exclude: ^uv\.lock$
      - id: check-merge-conflict
      - id: check-toml
      # deploy/compose.large.yml is excluded because it needs Compose's `!reset` tag to drop
      # a port the base file publishes, and yaml.safe_load — which this hook uses — rejects
      # any unknown tag. The standard-YAML alternative (`ports: []`) parses cleanly and does
      # nothing, which is the worse failure (TASK-0190).
      - id: check-yaml
        exclude: ^deploy/compose\.large\.yml$
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]

      # Only the fast tests run here. Integration needs a Docker daemon and eval downloads
      # model weights; making either a commit gate would block committing on a laptop with
      # Docker stopped. CI runs them as separate jobs.
      - id: pytest-unit
        name: pytest (unit)
        entry: pytest -q -m "not integration and not eval"
        language: system
        pass_filenames: false
        types: [python]

      - id: commit-message-rule
        name: conventional commit message, single line, no trailers
        entry: python scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
