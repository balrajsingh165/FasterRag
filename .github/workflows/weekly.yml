# Weekly runs of the two tiers no other workflow runs: a short soak and the load smoke
# (TASK-0488). Both existed as harnesses that had been run by hand and by nothing else, so a
# leak or a saturation defect introduced after their last manual run could ship unseen.
#
# WHAT THIS IS, so nobody reads more into a green run than it holds. Both jobs are behaviour
# checks, not measurements. The soak regresses RSS and open handles over a ten-minute run
# against in-process doubles (docs/testing-strategy.md §1.8): it can catch a leak that grows
# inside that window and says, in its printed verdict, what it could not have seen. The load
# smoke is the `load` marker (§1.7a): boundedness, conservation and typed refusal under a
# storm, plus the facade's import-time ceiling. Neither prints a number that may be cited
# (docs/benchmarks.md): a shared runner has neighbours, and the 24 h soak and the Locust
# benchmark still wait on TASK-0084's isolated hardware.
#
# Weekly rather than nightly: the soak is minutes of wall time for an answer that only moves
# when the ingestion path does, and the nightly already carries the measurement jobs.
name: weekly

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

concurrency:
  group: weekly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    # Ten minutes of soak, plus install. The ceiling bounds a hang, not the run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `-rs` because pytest exits 0 when every selected test skips, and `-m soak` replaces
      # addopts' marker filter rather than narrowing it, so only the soak tier is selected.
      - name: Short soak
        env:
          FASTERRAG_SOAK_SECONDS: "600"
        run: pytest -m soak -rs -p no:cacheprovider

  load-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Load smoke and the import-time budget
        run: pytest -m load -rs -p no:cacheprovider
