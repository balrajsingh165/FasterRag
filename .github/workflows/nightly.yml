# Nightly measurement runs. These exist to make the provable-claims policy infrastructure
# rather than habit: every "fastest", "most reliable", or SLO target in the docs must trace
# to a benchmark-ledger entry (docs/benchmarks.md), and a ledger nobody regenerates goes
# stale silently.
#
# Deliberately not part of `ci`. The `measure` job's eval harness downloads model weights and
# the two jobs run for minutes, so gating every push on them would trade a fast feedback loop
# for numbers that only matter once a day.
#
# The numbers produced here are NOT citable as benchmark-ledger entries on their own: a
# shared GitHub runner has neighbours, and docs/performance.md requires an isolated,
# documented machine. They are a regression signal — a large night-over-night move means
# something changed — and TASK-0084 remains the entry that needs real hardware.
#
# Uploading those numbers made a move recordable and left it undetected, because nobody
# diffs thirty JSON files by eye. The run therefore fetches the previous night's artifact
# and compares the two with scripts/compare_nightly.py, which reports three outcomes and
# never collapses "nothing to compare against" into a pass.
#
# The script never did collapse it; this workflow did. Until 2026-11-08 the not-comparable
# verdict was mapped to `::warning::` here while ci.yml's eval-gate exited 1 on the same
# verdict — one concept, two callers, opposite consequences — and that asymmetry is what let
# a benchmark that had measured nothing since at least 2026-08-16 report success 95 times
# out of 95 (TASK-0314). Both callers now fail on it. The first night after this change is
# expected to be red: the baseline it will find is the previous night's empty document, and
# the comparison is supposed to say so rather than wave it through.
#
# It does NOT file a bug. docs/todo.md is the only task file in this repository, and a job
# that opened an issue — or appended to the ledger — every night would be a second task list
# written by a machine from numbers the header above says are not citable. A regression here
# fails the job, which is already a notification, and a human decides whether it is worth an
# entry.
#
# The `mutation` job is here for the same reason as `measure` and not for the push path: it
# re-runs a test suite once per mutant, so it is minutes of work for an answer that only
# changes when a test or a target module changes. scripts/mutation_run.py explains why it is
# a purpose-built runner rather than mutmut or cosmic-ray.
#
# Its two outcomes are deliberately asymmetric, because the two failures they guard against
# are not the same failure. A SURVIVING MUTANT IS A WARNING, not a job failure: survivors
# include equivalent mutants (a perturbed constant that nothing can observe) and
# timing-dependent ones, so gating pushes — or nightlies — on a number that moves for
# non-bugs buys a gate that is switched off within the week. The answer to "a report nobody
# reads is how the FMEA table rotted" is not a brittle gate, it is making the report
# unavoidable: every survivor is written into $GITHUB_STEP_SUMMARY with its file, line and
# substitution, on the run page rather than inside an artifact nobody downloads.
#
# A run that COULD NOT BE PERFORMED does fail the job. That is exit code 2 — the target's
# own suite was already red, or no mutant could be generated — and it is the vacuity defect
# (rebuild-playbook T12) this repository treats as a bug: a red baseline kills every mutant
# for free and would otherwise report a perfect score.
#
# WHAT THIS JOB MEASURES, stated so that no reader has to infer it (TASK-0323): the INGEST
# suite only — parse and chunk over tests/eval/datasets/handbook/corpus. Not retrieval, not
# embedding, not indexing, not generation. docs/performance.md §3.7 says the same thing in
# the same words, and the ledger rules in docs/benchmarks.md still refuse every number this
# job produces, for the isolation reason above.
#
# TASK-0323 re-audited every place this file could report success without measuring, on the
# principle that a nightly that cannot fail is not a nightly. What it changed: the unused
# Qdrant service is deleted (see the measure job); a step that reads the benchmark document
# and fails when it is empty or does not carry the ingest suite now stands between the
# `continue-on-error` benchmark step and everything downstream; both uploads carry
# `if-no-files-found: error`, since the default `warn` would leave a green run with no
# artifact AND rob the next night of its baseline; the comparison distinguishes a crashed
# script from a judged regression, because an unhandled traceback also exits 1; the eval
# harness runs with `-rs`, since pytest exits 0 when every test skips; and the job carries a
# timeout so a hang is bounded. What it deliberately did NOT change: the two
# `continue-on-error` flags and the mutation job's survivors-are-a-warning rule, each of
# which is justified where it stands and each of whose justification now names the
# downstream step it depends on.
name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Two runs at once would each pick the other as "the previous nightly", and compare a run
# against its own sibling on an arbitrary machine. Queued rather than cancelled: a nightly
# that cancels itself measures nothing, which is the failure mode this whole file is about.
concurrency:
  group: nightly
  cancel-in-progress: false

# `actions: read` is what lets the default token list this workflow's earlier runs and pull
# an artifact from one of them; nothing here writes.
permissions:
  contents: read
  actions: read

jobs:
  measure:
    runs-on: ubuntu-latest
    # Observed at 2m35s-5m06s across the fifteen runs listed on 2026-11-08. The ceiling is a
    # bound on a hang, not a budget: GitHub's default is 360 minutes, and a job that can burn
    # six hours before anyone is told is a job whose failure is invisible for six hours.
    timeout-minutes: 30
    # TASK-0323: the Qdrant service block that stood here is GONE, and this is the record of
    # why. TASK-0314 added it after finding that every benchmark this job ever ran died on an
    # unreachable Qdrant — but the fix that landed with it, `--suite ingest`, measures parse
    # and chunk through `estimate_sources`, which constructs no vector-db adapter and opens
    # no socket. `pytest -m eval` below is the same marker ci.yml's `models` job runs
    # against no service at all. So nothing in this job contacted the server, and a declared
    # dependency that nothing uses is the same class of thing as the eighty-three days of
    # measuring nothing: it tells a reader the job reached a backend it never reached.
    #
    # The ledger offered two honest endings — supply a credential and restore the query
    # suite, or delete the service and say the nightly measures ingestion only. The second is
    # taken here because the first is not ours to take: the query suite answers through the
    # configured LLM, and a hosted runner holds no paid key. docs/performance.md §3.7 carries
    # the credential decision for the maintainer, with the cost of the offline alternative
    # (Ollama) priced out. When that decision is made, the service block comes back WITH the
    # step that contacts it, in the same commit.
    env:
      # Config validation fails fast on any env var a config key references, so these have
      # to be present before the CLI can load a config at all. Placeholders, and that is not
      # a shortcut: no step below calls a provider or a backend. QDRANT_API_KEY is still
      # required because the shipped config.yaml names it, not because anything connects.
      FASTERRAG_API_KEY: ci-placeholder
      QDRANT_API_KEY: ci-placeholder
      OPENAI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rerank,huggingface]"

      # `-rs` is not cosmetic. pytest exits 0 when every selected test SKIPS, so this step
      # can be green having verified nothing — the vacuity class (rebuild-playbook T12) that
      # docs/testing-strategy.md §1.11 already names for the live-provider checks, which skip
      # here because no credential is present. Without `-rs` the log says "21 passed, 9
      # skipped" and never which nine. With it, every skip prints its reason, so a run that
      # skipped everything is legible on the run page instead of being inferred later.
      - name: Retrieval eval harness
        run: pytest -m eval -q -rs

      # `continue-on-error` stays, and TASK-0323 re-audited it rather than inheriting it. It
      # is safe here for one specific reason: the step that follows reads the document and
      # fails the job when it is empty, and the comparison after that fails again on the same
      # evidence. The suppression buys the upload of a half-finished run without buying
      # silence. If either of those two steps is ever deleted or reordered, this flag becomes
      # a swallow again — that is the dependency, written down so a later editor sees it.
      #
      # The `|| true` that followed the command is GONE. Two suppressions on one
      # step is how a benchmark that could not run for 83 days read as a success: the first
      # keeps the job moving, the second hid the failure from the step as well, so nothing
      # anywhere was marked red. One of them was always one too many (TASK-0314).
      #
      # `--suite ingest` rather than the default `all`: the query suite answers a question
      # through the configured LLM, which config.yaml sets to openai/gpt-4o-mini against a
      # key this runner holds only as a placeholder, and `all` runs it FIRST and returns on
      # its failure — so `all` cannot reach the ingest suite and emits no document at all.
      # The ingest suite parses and chunks a committed corpus, needs no credential, and is
      # reproducible night over night. The query suite therefore stays unmeasured here: that
      # is a gap, not a result, and it is not what this job may claim to have measured.
      #
      # `chunking.token_counter=estimate` is pinned for the reason ci.yml pins it: `auto`
      # uses the embedding model's tokenizer when the machine has it cached and estimates
      # when it does not, so the recorded token count — and with it the `dataset` field the
      # comparison refuses to compare across — would depend on the runner's cache state.
      #
      # `vector_db.mode=external` is NOT a backend this step reaches — the ingest suite
      # builds no adapter at all. It is here so the loaded config never names the
      # docker-managed mode, which is the mode whose provisioning path this job has no
      # business entering. Said plainly rather than left to look like a connection.
      - name: Benchmark suite
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p artifacts
          fasterrag config init --path artifacts/config.yaml
          fasterrag --config artifacts/config.yaml \
            --set vector_db.mode=external \
            --set chunking.token_counter=estimate \
            --json benchmark --suite ingest \
            --sources tests/eval/datasets/handbook/corpus > artifacts/benchmark.json

      # The redirect above creates artifacts/benchmark.json whether or not the command
      # succeeded, so a failed run leaves a zero-byte file that looks like an output. The
      # comparison already refuses it, but only two steps later and under the name "not
      # comparable", which describes the baseline as much as the run. This step names the
      # failure where it happened and is the reason `continue-on-error` above is not a
      # swallow. It asserts the one thing this job claims to have done: that a document
      # exists and that it carries the ingest suite with a warmed median in it.
      - name: The benchmark produced a document
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys


          def refuse(message):
              print(f"::error::{message}")
              sys.exit(1)


          path = pathlib.Path("artifacts/benchmark.json")
          if not path.is_file() or path.stat().st_size == 0:
              refuse(f"{path} is missing or empty, so the benchmark did not run")
          try:
              document = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, ValueError) as exc:
              refuse(f"{path} is not a readable benchmark document ({exc})")
          raw = document.get("suites") if isinstance(document, dict) else None
          entries = raw if isinstance(raw, list) else []
          suites = {e.get("suite"): e for e in entries if isinstance(e, dict)}
          ingest = suites.get("ingest")
          if ingest is None:
              refuse(f"{path} records {sorted(k for k in suites if k)} and not the ingest suite")
          if not ingest.get("median"):
              refuse("the ingest suite recorded no warmed median, so it measured nothing")
          print(f"ingest suite measured: {ingest['median']}")
          PY

      # The newest completed run of this workflow other than this one. Empty on the very
      # first run, which the comparison reports as not-comparable rather than as a pass.
      - name: Locate the previous nightly run
        id: previous
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          run_id=$(gh api \
            "repos/${REPOSITORY}/actions/workflows/nightly.yml/runs?status=completed&per_page=30" \
            --jq "[.workflow_runs[].id | select(. != ${THIS_RUN})] | first // empty")
          echo "run-id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "previous nightly run: ${run_id:-none found}"

      # Artifacts expire after 30 days and a run that died before uploading has none, so a
      # failure here is an ordinary outcome: the comparison then finds no baseline and says
      # so, instead of the job dying on a missing file.
      - name: Download the previous night's measurements
        if: ${{ !cancelled() && steps.previous.outputs.run-id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: nightly-measurements
          path: previous/
          run-id: ${{ steps.previous.outputs.run-id }}
          github-token: ${{ github.token }}

      # Expect a red night when GitHub rolls the runner image: the comparison refuses a
      # baseline taken on a different machine, and its fingerprint carries the kernel
      # string. That is the rule working — a number from another machine measures the
      # machine — and the answer is to re-read the artifact, not to relax the verdict.
      - name: Compare against the previous night
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts
          set +e
          python scripts/compare_nightly.py \
            --previous previous/benchmark.json \
            --current artifacts/benchmark.json \
            --json-out artifacts/comparison.json \
            --summary "$GITHUB_STEP_SUMMARY"
          verdict=$?
          set -e
          # An unhandled traceback also exits 1, and reporting that as "a metric regressed"
          # would send a reader to look for a performance change that never happened. The
          # script writes --json-out before it returns any verdict, so a missing or
          # non-matching document distinguishes a crash from a judgement (TASK-0323).
          recorded=$(python -c "import json,sys;print((json.load(open('artifacts/comparison.json')) or {}).get('verdict',''))" 2>/dev/null || echo "")
          if [ "${verdict}" -le 2 ] && [ -z "${recorded}" ]; then
            echo "::error::scripts/compare_nightly.py exited ${verdict} without writing a comparison document, so it crashed rather than judged; the traceback is above"
            exit 1
          fi
          case "${verdict}" in
            0) ;;
            1) echo "::error::a tracked benchmark metric regressed beyond the tolerance against the previous nightly run; investigate on isolated hardware before trusting it"
               exit 1 ;;
            2) echo "::error::tonight's run could not be compared with the previous one, so no regression was ruled out; the benchmark document above says why — an empty or unreadable one means the benchmark did not run, which is a failure of this job and not a note on it"
               exit 1 ;;
            *) echo "::error::scripts/compare_nightly.py exited ${verdict}, which is not a verdict it defines"
               exit 1 ;;
          esac

      # `if-no-files-found` defaults to `warn`, which uploads nothing and annotates a run
      # that stays green — and this artifact is the NEXT night's baseline, so the absence
      # would surface a day later as "not comparable" and be read as a problem with the
      # baseline. `error` makes an empty artifacts/ a failure of the night that produced it
      # (TASK-0323).
      - name: Upload ledger-format artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-measurements
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  mutation:
    runs-on: ubuntu-latest
    # A mutant costs one run of its target's suite. The budget below bounds the count, but a
    # pathological mutant can still hang, so the job carries a ceiling of its own on top of
    # the per-mutant --timeout.
    #
    # TASK-0316: this job has never once succeeded. Both scheduled runs ended
    # `##[error]The runner has received a shutdown signal` with exit 143, at 2m31s and
    # 4m13s into the step, nowhere near the 90-minute ceiling that stood here — so the
    # ceiling was never what killed it and raising or keeping it answers nothing. 45 is the
    # ceiling a bounded run needs: at --budget 10 over six targets the run is 66 pytest
    # invocations, and a job that overruns that has hung rather than slowed. What the
    # ceiling CANNOT bound is memory, which is the leading hypothesis for the SIGTERM — a
    # mutated comparison or arithmetic operator can turn a bounded loop into an unbounded
    # one, and --timeout bounds a mutant's seconds, not its resident set. The sampler in the
    # step below is there to say which resource it was, since the log said nothing at all.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Only `.[dev]`: the targeted modules are pure chunking, retrieval, identity, breaker,
      # regression-gate and rate-limit logic, and their unit tests run without model weights.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # --budget caps the mutants per target with a seeded, reproducible sample, so a night
      # takes a bounded time and two nights on the same code report the same mutants rather
      # than a different random slice. Raise it, or drop it for an exhaustive run, when
      # somebody is actually working through the survivor list.
      #
      # 40 became 10 for TASK-0316: 240 mutants is 246 pytest invocations, and a job that
      # has never finished should first be made to finish once. The sample is seeded, so a
      # different budget is a different ten mutants, not the first ten of the forty — the
      # survivor list this produces is a subset in size, not a prefix.
      #
      # The scaffolding around the run exists because the two failed runs carried NO script
      # output whatsoever before the kill, which is diagnosable only if something is
      # printing. PYTHONUNBUFFERED stops Python block-buffering a non-tty stdout; note that
      # it is necessary and not sufficient, because scripts/mutation_run.py writes its
      # report only after every mutant has run, so there is nothing to flush until the end —
      # the per-mutant progress line that would name the mutant in flight at the kill has to
      # be added to the script itself, and that change is reported rather than made here.
      # The sampler is what the workflow side CAN do: it streams free memory, free swap,
      # free disk and the largest resident process into the live log every ten seconds, so
      # the next SIGTERM leaves a record of which resource was gone when it arrived. It is
      # killed on exit, or the step would never close its stdout. /usr/bin/time -v prints
      # peak RSS for a run that completes, which is the measurement TASK-0316 asks for.
      - name: Mutate the targeted modules
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p artifacts
          ( while true; do
              printf 'resources t=%ss mem_avail_kb=%s swap_free_kb=%s disk_avail_kb=%s largest=%s\n' \
                "${SECONDS}" \
                "$(awk '/^MemAvailable:/{print $2}' /proc/meminfo)" \
                "$(awk '/^SwapFree:/{print $2}' /proc/meminfo)" \
                "$(df --output=avail -k / | tail -n 1 | tr -d ' ')" \
                "$(ps -eo rss=,comm= --sort=-rss | head -n 1 | tr -s ' ')"
              sleep 10
            done ) &
          sampler=$!
          trap 'kill "${sampler}" 2>/dev/null || true' EXIT
          runner=(python)
          if [ -x /usr/bin/time ]; then
            runner=(/usr/bin/time -v python)
          fi
          set +e
          "${runner[@]}" scripts/mutation_run.py \
            --budget 10 \
            --timeout 300 \
            --json-out artifacts/mutation.json \
            --summary "$GITHUB_STEP_SUMMARY"
          verdict=$?
          set -e
          case "${verdict}" in
            0) ;;
            1) echo "::warning::mutants survived: lines in the targeted modules that no test defends. The full list, with file, line and substitution, is in this run's summary and in the mutation.json artifact" ;;
            2) echo "::error::the mutation run could not be performed — a target's own test suite was already red, or no mutant could be generated, either of which would have scored a perfect run for free"
               exit 1 ;;
            *) echo "::error::scripts/mutation_run.py exited ${verdict}, which is not a verdict it defines"
               exit 1 ;;
          esac

      # Same reason as the measure job's upload: the default `warn` would leave a green run
      # whose survivor list does not exist, and the survivor list is the whole output of this
      # job (TASK-0323).
      - name: Upload the survivor list
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-survivors
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
