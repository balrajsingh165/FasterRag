# Blocking quality gates from docs/testing-strategy.md §2. Gates for integration tests,
# the adapter contract suite, and the eval regression gate are added by the slices that
# introduce them (docs/todo.md).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  # release.yml calls this file as its gate set, so a release passes every job below as it
  # stands on the tagged commit rather than a copy of them that drifts (TASK-0445).
  workflow_call:

# `github.workflow` is the CALLER's name when this file is called, so a release rehearsal
# dispatched on `main` runs in `ci-release-refs/heads/main` and a push to `main` in
# `ci-ci-refs/heads/main`. Keyed on the ref alone the two shared a group, and with
# `cancel-in-progress` a rehearsal would have cancelled the push run it was started beside.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# TASK-0490. pytest-timeout (in the dev extra) reads this, so every pytest run below fails a test
# that hangs instead of holding its lane until the runner's six-hour limit. 300 s is about nine
# times the slowest unit-tier test measured on a loaded Windows dev machine (33 s,
# tests/chaos/test_process_kill.py, 2026-11-12). The eval modules raise it to 1800 s for model
# downloads; the soak and load tiers opt out, because they run for as long as they are told to.
env:
  PYTEST_TIMEOUT: "300"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # CRITICAL: this is an unpinned resolve at job time, and so is every other `pip install`
      # in this file. It is deliberately still here. `must-run` installs from uv.lock instead
      # (TASK-0398) and is the canary that decides whether the rest follow: convert them when
      # it has been green across a few runs, revert that one job if it is not. Do not convert
      # them before it has, and do not convert them one at a time for the same reason — the
      # canary's evidence covers `.[dev]` on ubuntu/3.12, which is this job, `packaging`,
      # `integration` and `must-run`; `windows`, the two torch jobs and bare `.` each add an
      # axis the canary did not test.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Typecheck
        run: mypy

      # The audit found CLAUDE.md and README both claiming a documentation-only repository
      # over ~200 shipped modules. CLAUDE.md is loaded as instructions every session, so a
      # false claim there is followed, not just read.
      # CRITICAL: every gate below carries `if: !cancelled()` so each reports its own
      # verdict. Without it they run in sequence after Typecheck with no condition, and on
      # run 42522906097 a Typecheck failure reported all nine as `skipped` -- which reads as
      # "not applicable" rather than "unknown". TASK-0338's widened scan and TASK-0342's
      # unreadable rule were committed on 2026-11-08 and first executed on 2026-11-11 for
      # exactly that reason: a gate that is declared, committed, and never run.
      - name: Docs match the repository
        if: ${{ !cancelled() }}
        run: python scripts/check_doc_truth.py

      # Endpoint drift is silent both ways: an undocumented route ships a surface clients
      # find by accident, and a documented-but-absent one promises a 404. Neither shows up
      # in a test suite, because each half is individually correct.
      - name: API matches its reference
        if: ${{ !cancelled() }}
        run: python scripts/check_openapi_drift.py

      # blockers.md is a view over todo.md, and a drifted view is worse than none: it either
      # hides a live blocker or presents a resolved one, and a reader cannot tell which.
      - name: Blockers view matches the ledger
        if: ${{ !cancelled() }}
        run: python scripts/check_blockers.py

      # Three separate rounds shipped documents asserting that already-built work did not
      # exist, each caught by eye. A denial that cites a task the ledger has ticked is stale
      # by the ledger's own account, and that much is machine-checkable.
      - name: Denials still cite open work
        if: ${{ !cancelled() }}
        run: python scripts/check_claims.py

      # The gate above asks the ledger; this one asks the tree, because an umbrella id keeps
      # every denial citing it green. TASK-0049 covers six adapters and stayed correctly open
      # while Chroma, Milvus and Weaviate shipped under it, so five documents called built
      # adapters unbuilt on three separate days and every check passed. A factory registry and
      # a filesystem decide existence without reading a task id at all. It now also reads the
      # pytest marker registry (TASK-0369) and inherits a denial from a table column header or
      # a prose lead-in label (TASK-0371) — README's "Not yet" column carried no denial verb in
      # any cell, which is how shipped adapters and a shipped test tier sat in it. Measured
      # over four trees: 574 tables, 1,177 tier mentions, 3 findings, every one real.
      # Since TASK-0394 it reads the degradation ladder's rung registry too, which is what
      # makes "the cache_only rung is specified but not built" decidable instead of asserted:
      # 146 rung mentions over the same four trees, 0 findings, and 4 the day TASK-0159 lands.
      - name: Denials match the tree, not just the ledger
        if: ${{ !cancelled() }}
        run: python scripts/check_unbuilt_claims.py

      # The sibling gates above all scan docs/ and none opens a .py file, so a docstring or
      # a `# TODO:` marker could cite a ticked, superseded or invented task and stay green —
      # which is how three rate-limit modules kept pointing at finished work. CI only: the
      # maintainer directed that doc gates stay out of pre-commit.
      - name: Task ids cited in code resolve
        if: ${{ !cancelled() }}
        run: python scripts/check_task_ids.py

      # ruff's E722 catches a bare `except:` and stops there, so until this gate nothing
      # checked the rule CLAUDE.md calls mandatory: that no exception is silently
      # swallowed. In a RAG pipeline a swallowed exception does not surface as an error, it
      # surfaces as a confident answer built from a silently shortened context. A code
      # gate, not a doc gate, so the maintainer's pre-commit exclusion for doc gates does
      # not apply. Measured ~1 s on ubuntu-latest (run 42972651661, 06:29:54-55Z), which is
      # the environment this step runs in; 0.96-1.02 s locally on Windows for comparison.
      - name: Typed error taxonomy holds
        if: ${{ !cancelled() }}
        run: python scripts/check_error_taxonomy.py

      # ruff has no rule for "this comment is prose" and mypy never reads one, so until this
      # gate nothing checked CLAUDE.md's docstrings-only rule: a 2026-11-08 scan found 130
      # prose comment lines in 30 of src/'s 151 modules. Reasoning in a comment is reasoning
      # nobody greps and nothing keeps true; the same words in docs/code-notes.md show up in
      # a documentation diff. A code gate, not a doc gate, so the pre-commit exclusion does
      # not apply. Measured at 0.37-0.39 s locally on Windows, interpreter start included.
      - name: Only permitted comments exist
        if: ${{ !cancelled() }}
        run: python scripts/check_comments.py

      # Nothing checked which way imports point: ruff sorts them, mypy follows them, and a
      # cycle between two packages imports fine until the load order changes. A 2026-11-12
      # scan found eighteen module pairs importing upward, among them the facade importing
      # its service builders from the REST layer through function-level imports no
      # module-level scan would see. The gate reads every import statement at any depth and
      # every registry string naming a module; today's violations are named exceptions in
      # the script, and an exception nothing matches any more fails it too (TASK-0456). A
      # code gate, not a doc gate. Measured at 0.5-0.6 s locally on Windows, interpreter
      # start included.
      - name: Imports point down the layers
        if: ${{ !cancelled() }}
        run: python scripts/check_layering.py

      # The four mechanical places a version lives cannot be edited atomically by hand, and
      # a tree halfway through a stamp ships a wheel that contradicts its own README.
      - name: Version is coherent across the tree
        if: ${{ !cancelled() }}
        run: python scripts/stamp_release.py --check

      # `-rs` prints every skip with its reason. A test that skips on every platform is
      # indistinguishable from a test that does not exist, and the only way anyone found
      # that out before was by reading the progress dots character by character against a
      # local collection count (TASK-0328). Measured on run 42411261475: 7 of 3486 selected
      # tests skip here, and the same 7 skip on the windows job.
      - name: Unit tests
        env:
          FASTERRAG_MUST_RUN_REPORT: must-run-reports/must-run-ubuntu.json
        run: pytest -m "not integration and not eval and not load and not soak" -rs --cov --cov-report=term-missing

      # The other half of `-rs`, and the half a reader cannot skip (TASK-0349). The variable
      # above makes tests/conftest.py write what this lane did with every `must_run` test;
      # the `must-run` job at the foot of this file reads this artifact beside the windows
      # one and fails when a marked test skipped in both. It is set on THIS step only — the
      # two coverage runs below invoke pytest again and would overwrite the document with
      # whatever their own `-m` selection saw.
      - name: Upload this lane's must-run report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: must-run-ubuntu
          path: must-run-reports/must-run-ubuntu.json
          if-no-files-found: error

      # Scoped to the packages docs/testing-strategy.md gates, not the whole tree. A
      # repository-wide threshold is diluted by CLI plumbing and API wiring, so it can stay
      # green while the retrieval and adapter code it exists to protect regresses. Measured
      # at 87% branch coverage on 2026-08-02; the gate sits at 85 to leave working room
      # without letting it drift.
      - name: Coverage gate (core, adapters, workers)
        run: >
          pytest -m "not integration and not eval and not load and not soak" -q
          --cov=src/fasterrag/core
          --cov=src/fasterrag/adapters
          --cov=src/fasterrag/workers
          --cov-report=
          --cov-fail-under=0

      # Chroma's contract suite is marked `integration` but is the only one that needs no
      # server and no daemon — it runs embedded against a temporary directory. Excluding it
      # would score a 515-statement adapter at 36% while 50 contract cases actually exercise
      # it, so the gate would measure the marker rather than the coverage. Appended here
      # rather than un-marking the suite, because it IS an integration test by intent.
      - name: Coverage gate (append Chroma's serverless contract suite)
        run: >
          pytest tests/integration/chroma -m integration -q
          --cov=src/fasterrag/core
          --cov=src/fasterrag/adapters
          --cov=src/fasterrag/workers
          --cov-append
          --cov-report=term
          --cov-fail-under=85

      # D10 dogfooded, and the packaged-template path with it: this is the only job that
      # exercises `config init` the way a `pip install` user does. The placeholder keys are
      # set so doctor gets past config validation and actually runs its environment checks —
      # without them it would exit 4 on the first one and the smoke test would pass
      # trivially. Exit 4 is still accepted afterwards, because CI has no Docker daemon and
      # a check *reporting* that is doctor working, not failing. A crash still fails the job.
      - name: Doctor smoke test
        env:
          FASTERRAG_API_KEY: ci-placeholder
          QDRANT_API_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
        run: |
          mkdir -p /tmp/doctor && cd /tmp/doctor
          fasterrag config init
          test -f config.yaml && test -f .env.example
          fasterrag doctor --json || [ $? -eq 4 ]

  # The project is developed on Windows and two shipped defects were Windows-only: a
  # path-case document id (`d:\` and `D:\` hashing differently, TASK-0141) and a UTF-8 BOM
  # rejected by the config loader. Both are invisible to an ubuntu-only matrix. Lint,
  # format, and typecheck are not repeated here — they are platform-independent and already
  # gate on the quality job.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `-rs` for the reason the quality job carries it: the two platforms' skip lists are
      # only comparable when both are printed (TASK-0328).
      - name: Unit tests
        env:
          FASTERRAG_MUST_RUN_REPORT: must-run-reports/must-run-windows.json
        run: pytest -m "not integration and not eval and not load and not soak" -rs

      # This platform is half of the comparison the `must-run` job makes, and the half that
      # makes the rule "ran SOMEWHERE" rather than "ran everywhere": the symlink confinement
      # cases legitimately skip on a Windows account without SeCreateSymbolicLinkPrivilege,
      # so a verdict read from one platform alone would either fail a correct run or accept
      # one that skipped on both (TASK-0349).
      - name: Upload this lane's must-run report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: must-run-windows
          path: must-run-reports/must-run-windows.json
          if-no-files-found: error

  # TASK-0490. pyproject.toml's classifiers claim Python 3.12 and 3.13, and until this job every
  # lane ran 3.12, so the 3.13 claim was proved by nothing. The unit tier on 3.13 — ubuntu only,
  # because the windows job already covers the platform axis on 3.12. Measured locally before it
  # was added: 5014 passed, 23 skipped, 0 failed on CPython 3.13.15 / Windows, from a venv
  # synced with `uv sync --locked --extra dev --python 3.13` (2026-11-12).
  unit-py313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests on Python 3.13
        run: pytest -m "not integration and not eval and not load and not soak" -rs

  # The only job that exercises what a `pip install fasterrag` user actually receives.
  # Nothing else can: pytest puts src/ on sys.path, so the whole suite imports the checkout
  # and would stay green through a wheel that ships no `fasterrag.data/config.yaml`, no
  # console script, or a packages list that quietly drops a subpackage.
  #
  # Its own job rather than a step on quality, because it builds a wheel and a clean venv
  # (~95s measured locally on 2026-10-29) and that cost belongs beside the test run rather
  # than in front of it — on the push path either way, since a broken wheel is a release
  # blocker and finding it at tag time is finding it too late. Installing `.[dev]` rather
  # than bare `build` is deliberate: it also fails if `build` is ever dropped from the dev
  # extra, which is the defect that sent a releaser to a tool they did not have.
  #
  # Since TASK-0444 the script also adds `[chroma,huggingface]` to that venv and runs the local
  # profile end to end — ingest a Markdown file, answer a `retrieve`, no service and no key.
  # That installs torch (from the CPU-only index, not PyPI's CUDA build) and downloads the
  # embedding model from the Hugging Face Hub, so this job now takes minutes, not seconds.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wheel installs and imports as a consumer gets it
        run: python scripts/check_package.py

  # TASK-0498 and TASK-0486. Every script in examples/ runs here, and the sample plugin is
  # installed with pip and run against the shared vector-database contract suite. Retrieval
  # runs on the local profile for real (embedded Chroma, the local embedding model); the
  # generation scripts select the offline scripted LLM from examples/scripted-llm through
  # FASTERRAG_SET, because this runner has neither a key nor a model server. Each script exits
  # non-zero when its result is not what it demonstrates. See examples/README.md.
  #
  # torch comes from the CPU index for the reason check_package.py gives, and the embedding
  # model (about 130 MB) is cached between runs so a push does not download it again.
  examples:
    runs-on: ubuntu-latest
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache the embedding model
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .hf-cache
          key: hf-bge-small-en-v1.5-v1

      - name: Install fasterRag, the local-profile extras and both sample packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,chroma,huggingface]" --extra-index-url https://download.pytorch.org/whl/cpu
          pip install ./examples/plugin-vectordb ./examples/scripted-llm

      - name: The sample plugin passes the vector-database contract suite as installed
        run: python -m pytest examples/plugin-vectordb/tests -rs -p no:cacheprovider

      - name: Every example runs
        run: |
          mkdir -p /tmp/examples && cd /tmp/examples
          fasterrag config init --profile local
          export FASTERRAG_SET="llm.provider=scripted"
          for example in retrieve_only ingest_and_ask stream_answer swap_provider replay_trace; do
            echo "::group::${example}"
            python "${GITHUB_WORKSPACE}/examples/${example}.py"
            echo "::endgroup::"
          done

  # security.md §6. Split from the quality job so a dependency advisory published overnight
  # does not read as "the tests broke".
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # Scans full history, not the diff. A secret committed and later removed is still in
      # the history, and still compromised — checking only the tip would call it clean.
      #
      # That sentence stood here while the step did the opposite (TASK-0315). Measured on
      # run 41865567333: `gitleaks detect ... --log-opts=-1`, 1 commits scanned, ~3188
      # bytes, while the same action on security.yml's schedule scanned 290 commits and
      # 6.26 MB of the same SHA. `fetch-depth: 0` above was paid and thrown away. The cause
      # is in the action rather than in this file: gitleaks-action@v2 appends `--log-opts=-1`
      # when a push event's base and head refs match, and offers no override for it — its
      # only documented lever, BASE_REF, selects a RANGE (`--no-merges --first-parent
      # base^..head`), which is still not the history. Read in its src/gitleaks.js at tag v2
      # on 2026-11-08.
      #
      # So the comment could be corrected or the control could be. The control is corrected,
      # because the alternative leaves a full clone fetched for a scan that does not use it,
      # and leaves one secret-scan verdict that depends on which trigger fired — the two
      # disagreed on the same commit, which is how this was found. Scanning history on push
      # also catches the case the tip scan cannot: a multi-commit push whose middle commit
      # carries the credential.
      #
      # Running the binary rather than the action also pins it. The action resolves
      # "latest" at run time, so the rule set moves under the repository without a commit,
      # and a scan whose rules change silently cannot be reproduced from a SHA. The archive
      # is checksummed against the published gitleaks_8.30.1_checksums.txt before it runs.
      # `gitleaks git` is the command `detect` was deprecated in favour of in v8.19.0, and
      # with no --log-opts it walks the whole log, which is what security.yml's scheduled
      # run already does through the action.
      #
      # CRITICAL: this is now the same control implemented twice, here and in security.yml.
      # They must not be allowed to drift the way the dependency audit's two copies did —
      # the fix is one composite action under .github/actions/, as that audit now uses.
      - name: Secret scan
        uses: ./.github/actions/secret-scan

      # The action uploaded its SARIF; keeping that is the point of the step, since a

      # `!cancelled()` because the licence step below runs after a failed secret scan too,
      # and without uv it can only report "command not found" instead of its own verdict.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        if: ${{ !cancelled() }}
        with:
          enable-cache: true

      # The lockfile is the contract. `--check` resolves pyproject.toml and fails if the
      # result differs from uv.lock, so a dependency added without relocking is caught here
      # rather than discovered when two machines install different versions.
      - name: Lockfile is current
        run: uv lock --check

      # The audit itself, and the four accepted chromadb ignores with the review that
      # justifies them, live in .github/actions/dependency-audit. security.yml runs the
      # same action on the scheduled trigger. It was two copies until 2026-11-07, and the
      # copies drifted the day they diverged (TASK-0308).
      - name: Dependency audit
        uses: ./.github/actions/dependency-audit

      # Every release the lockfile names for the core install and every extra a user can ask
      # for, against the allow-list in the script (TASK-0496). A licence nobody here has looked
      # at, and a package that declares none, both fail; the accepted exceptions are listed
      # in the script with their reasons and printed on every run, and the full table goes to
      # the step summary. `!cancelled()` so an advisory published overnight does not hide
      # this verdict behind the audit's.
      - name: Dependency licences are on the allow-list
        if: ${{ !cancelled() }}
        run: |
          uv export --format requirements-txt --locked --all-extras --no-extra dev \
            --no-emit-project --no-hashes -o licences.txt
          python .github/scripts/check_licences.py licences.txt --summary "${GITHUB_STEP_SUMMARY}"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `-rs` because this job's skip list is the largest in the repository and was invisible
      # until TASK-0328 counted it: on run 42411261475, 98 of 380 selected cases skipped, all
      # of them the Milvus (45) and Weaviate (53) contract suites. The job is green either
      # way, so the only thing distinguishing "two adapters verified" from "two adapters not
      # reached" is this line.
      - name: Adapter contract suite against real backends
        run: pytest -m integration -rs

  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rerank]"

      # `-rs` is load-bearing here rather than informational: docs/testing-strategy.md §1.11
      # says a green `pytest -m eval` with no credentials proves nothing about any provider,
      # and names pytest's own SKIPPED line as the record that makes it legible. Without
      # `-rs` that line is not printed and the record does not exist (TASK-0328).
      - name: Verify against real embedding and reranking models
        run: pytest -m eval -rs

  # The D7 retrieval regression gate (docs/testing-strategy.md §2 gate 6). Its own job
  # rather than a step on `models`: that job runs the eval-marked tests, while this one
  # builds a real collection in a real Qdrant with real embeddings and scores it, which is
  # a different environment and a different cost.
  #
  # Every setting below is pinned rather than inherited, and each one is a value the
  # committed baseline records field by field in tests/eval/datasets/handbook/baseline.json:
  #
  #   retrieval.rerank=false            the shipped default since ADR-0010, pinned anyway:
  #                                     the cross-encoder it names is a 2.2 GB download on
  #                                     every push. The baseline was measured without it,
  #                                     so this gate covers retrieval and fusion and NOT
  #                                     the reranker.
  #   retrieval.top_k=5                 the baseline measured recall@5.
  #   chunking.token_counter=estimate   `auto` uses the embedding model's tokenizer when it
  #                                     is cached on the machine and silently estimates
  #                                     when it is not, so chunk boundaries would depend on
  #                                     the runner's cache state. A gate has to chunk the
  #                                     same way every time.
  #
  # The collection is created by the ingest itself (the indexer sizes it from the first
  # batch), so there is no separate `index create` step to disagree with it.
  eval-gate:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.1
        ports:
          - 6333:6333
          - 6334:6334
    env:
      # Config validation fails fast on any env var a config key references, so the gate
      # needs these present before it can reach the eval at all. Placeholders: this job
      # scores retrieval against a local Qdrant and never calls an LLM.
      QDRANT_API_KEY: ci-placeholder
      FASTERRAG_API_KEY: ci-placeholder
      OPENAI_API_KEY: ci-placeholder
      GATE: >-
        --config config.yaml
        --set vector_db.mode=external
        --set chunking.token_counter=estimate
        --set retrieval.top_k=5
        --set retrieval.rerank=false
        --set eval.regression_gate=true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,huggingface]"

      # The image declares no HEALTHCHECK, so GitHub cannot wait on the service and the
      # first request would race its start-up.
      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:6333/readyz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Qdrant did not become ready within 120 seconds"
          exit 1

      - name: Build the collection the gate scores
        run: fasterrag $GATE ingest tests/eval/datasets/handbook/corpus --collection handbook

      # `--suite eval` exits 5 on anything the gate refuses, so the run is allowed to fail
      # and the verdict is read from the document rather than from the exit code: 5 alone
      # cannot tell "recall fell" from "nothing was comparable", and those need different
      # answers from a human.
      - name: Retrieval regression gate (D7)
        run: |
          set +e
          fasterrag $GATE --json benchmark --suite eval \
            --dataset tests/eval/datasets/handbook --collection handbook > gate.json
          code=$?
          set -e
          cat gate.json
          read_gate="import json,sys;g=(json.load(open('gate.json')).get('gate') or {})"
          verdict=$(python -c "${read_gate};print(g.get('verdict','crashed'))" || echo crashed)
          python -c "${read_gate};sys.stdout.writelines('  %s\n' % r for r in [*g.get('failures',[]),*g.get('obstacles',[])])" || true
          case "${verdict}" in
            within-tolerance)
              echo "the gate compared this build against the committed baseline and found no drop beyond tolerance" ;;
            regressed)
              echo "::error::retrieval quality fell beyond eval.recall_tolerance or eval.ndcg_tolerance against tests/eval/datasets/handbook/baseline.json"
              exit 1 ;;
            not-comparable)
              echo "::error::the gate compared nothing, so no regression was ruled out; re-record the baseline from the measured report printed above rather than relaxing the gate"
              exit 1 ;;
            *)
              echo "::error::fasterrag benchmark --suite eval exited ${code} without a verdict this gate defines"
              exit 1 ;;
          esac

  # TASK-0349. `-rs` on every pytest invocation above prints each skip with its reason,
  # which makes a skip legible to somebody who reads the log; it does not make one impossible
  # to ignore. The census that found "all seven unit-lane skips skip on both platforms" was
  # produced by diffing progress dots against a local collection count, by hand, once — and a
  # test that skips on every platform is indistinguishable from a test that does not exist,
  # with the build green either way.
  #
  # So `@pytest.mark.must_run` is a claim — *this test executes somewhere in CI* — and this
  # job is what the claim costs. Its own job rather than a step on `quality`, because the
  # evidence spans two runners: `windows` runs in parallel and its report cannot be read
  # until it finishes, which is what `needs` is for.
  #
  # The rule is RAN AT LEAST ONCE, never "ran everywhere". The symlink confinement cases
  # cannot run on a Windows account without SeCreateSymbolicLinkPrivilege, and skipping
  # there while running on Linux is the correct outcome; skipping on BOTH is the bug, because
  # the confinement guard's symlink leg is then unverified everywhere. scripts/check_must_run.py
  # keeps the two platforms' verdicts apart and prints both, rather than flattening them.
  #
  # The roster is collected here rather than taken from a lane, and that is the vacuity guard
  # this gate's shape demands: a lane can only report on tests it collected, so a test marked
  # must_run and left in a lane CI never runs would appear in no report at all, and "absent
  # everywhere" must not read as "nothing to check". `-m must_run` overrides the marker filter
  # in `addopts`, so the collection sees the eval and integration tiers too. If a marked test
  # ever lands in a lane that does not set FASTERRAG_MUST_RUN_REPORT, this job fails with
  # `ran-nowhere` naming every lane — wire that lane, do not unmark the test.
  must-run:
    runs-on: ubuntu-latest
    needs: [quality, windows]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      # TASK-0398's canary, and the only job in this file that installs what uv.lock says.
      # Every other job runs `pip install -e ".[dev]"`, which resolves at job time: measured
      # 2026-11-11, that resolve and the lockfile name the SAME 145 packages for `.[dev]` and
      # disagree on the version of 42 of them (mypy 2.4.1 against 2.4.0, ruff 0.17.4 against
      # 0.17.3), while the maintainer's venv disagrees with the lock on 85 of its 170 and runs
      # 3.14.7 against this 3.12. Three resolutions, no two equal, which is how `main` went red
      # on 2026-11-08 with every local signal green: CI had httpx2 and the venv did not.
      #
      # This job goes first, and alone, because its red is the cheapest and the most legible
      # in the file. It `needs` quality and windows, so lint, types and both test lanes have
      # already posted their verdicts when it starts and a failure here cannot be mistaken for
      # one of theirs; it has four steps that can fail — install, download, collect, check —
      # so a red names its own cause; and it holds nothing else up. It is still a real
      # exercise rather than a token one — `--extra dev` installs
      # the same package NAMES pip installs here today, nothing added, no torch and no CUDA
      # (that is `--all-extras`: 3.2 GB against 194 MB, measured from the lock's wheel sizes)
      # — and the collection below imports the whole test tree, eval and integration tiers
      # included. So green here is the evidence that converting `quality` is safe, and red
      # here costs one job on a run whose real gates have already spoken. The price of that
      # `needs` is stated rather than discovered: this job is SKIPPED when quality or windows
      # fails, so the canary reports only on runs that were already green, and a conversion
      # decision has to count green runs rather than elapsed days.
      #
      # `--locked` fails instead of relocking, making this a second `uv lock --check` beside
      # supply-chain's. uv syncs into `.venv` rather than into setup-python's environment,
      # which is what the GITHUB_PATH line is for — every later step must find that one.
      - name: Install from the lockfile
        run: |
          uv sync --locked --extra dev --python 3.12
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      # A pattern that matches nothing fails the download, and the gate below fails again on
      # the empty directory. Both are deliberate: an artifact that silently did not arrive is
      # the obvious way for this job to go green having read nothing.
      - name: Download both lanes' must-run reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: must-run-*
          merge-multiple: true
          path: must-run-reports

      # Exit 5 is pytest's "no tests collected", which here means the marker is registered
      # and nothing carries it. That is a finding rather than a crash, so it is handed to the
      # gate — which names it `empty-roster` and fails with an explanation. Any other non-zero
      # exit is collection itself breaking, and is reported as that.
      - name: Collect the roster of tests claiming the marker
        env:
          FASTERRAG_MUST_RUN_REPORT: roster/roster.json
        run: |
          set +e
          pytest -m must_run --collect-only -q
          collected=$?
          set -e
          if [ "${collected}" -ne 0 ] && [ "${collected}" -ne 5 ]; then
            echo "::error::collecting the must_run roster exited ${collected}, so the gate below has no authoritative set to check against"
            exit 1
          fi

      - name: Every must-run test ran in at least one lane
        run: python scripts/check_must_run.py --roster roster/roster.json must-run-reports

  commit-messages:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Commit message rule
        run: |
          python scripts/check_commit_message.py \
            --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  # Nothing in this repository read the Actions API until now, and that is the whole reason
  # `main` was red for 81 days (TASK-0261) and then again from 2026-11-08 to 2026-11-11
  # (TASK-0313) with every local signal green. The pre-commit hook passes on the developer's
  # machine, so each commit looks green to the person making it, and the only evidence to
  # the contrary lives in a tab nobody opens.
  #
  # This job fails the push run — the run attached to the commit, shown in the merge box,
  # emailed on failure — when any OTHER workflow's last conclusion on `main` is not green.
  # It is deliberately not filtered by trigger: on 2026-11-07 `main` was green on the `ci`
  # push run and simultaneously red on the `security` and `nightly` SCHEDULED runs of the
  # same commit, so a check that read only the visible trigger would reproduce the bug.
  #
  # `--exclude ci.yml` is required, not a convenience. A workflow that gates on its own
  # previous conclusion has no working state: treat its own last red as a failure and the
  # push that fixes the cause still reads that red and fails, so the branch can never return
  # to green; excuse it and it excuses every red, because the latest completed `ci.yml` run
  # on `main` is always an ancestor of the commit under test. Self-checking is deadlocked or
  # vacuous, with nothing in between — and `ci.yml`'s own verdict is the one already visible.
  #
  # The anonymous GitHub budget is 60 requests an hour per ADDRESS, shared with every other
  # job on this runner, so the step authenticates with the workflow's own `actions: read`
  # token rather than gambling on a neighbour's spend. `fasterrag ci-status` never reads a
  # token it was not handed the name of.
  #
  # `--exclude release.yml` is the second exclusion and has a different reason. That workflow
  # runs on a `v*` tag, or by hand as a rehearsal, and never on a push to `main` — so "no
  # completed run on this branch" would be its permanent answer, and this job would have
  # been red from the commit that added the file. Its verdict belongs to the tag it ran on,
  # where it is the run the maintainer is watching.
  branch-verdict:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Exits 1 on a red or never-completed workflow and 3 when the API could not be read.
      # Never 0 for either: a check that goes green because it could not ask is the same
      # defect as the gate it replaces, and TASK-0314/0315/0316 are what that costs.
      - name: Every other workflow's last conclusion on main is green
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: fasterrag ci-status --branch main --exclude ci.yml --exclude release.yml --token-env GITHUB_TOKEN
