# Blocking quality gates from docs/testing-strategy.md §2. Gates for integration tests,
# the adapter contract suite, and the eval regression gate are added by the slices that
# introduce them (docs/todo.md).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Typecheck
        run: mypy

      # The audit found CLAUDE.md and README both claiming a documentation-only repository
      # over ~200 shipped modules. CLAUDE.md is loaded as instructions every session, so a
      # false claim there is followed, not just read.
      - name: Docs match the repository
        run: python scripts/check_doc_truth.py

      # Endpoint drift is silent both ways: an undocumented route ships a surface clients
      # find by accident, and a documented-but-absent one promises a 404. Neither shows up
      # in a test suite, because each half is individually correct.
      - name: API matches its reference
        run: python scripts/check_openapi_drift.py

      # blockers.md is a view over todo.md, and a drifted view is worse than none: it either
      # hides a live blocker or presents a resolved one, and a reader cannot tell which.
      - name: Blockers view matches the ledger
        run: python scripts/check_blockers.py

      # Three separate rounds shipped documents asserting that already-built work did not
      # exist, each caught by eye. A denial that cites a task the ledger has ticked is stale
      # by the ledger's own account, and that much is machine-checkable.
      - name: Denials still cite open work
        run: python scripts/check_claims.py

      # The gate above asks the ledger; this one asks the tree, because an umbrella id keeps
      # every denial citing it green. TASK-0049 covers six adapters and stayed correctly open
      # while Chroma, Milvus and Weaviate shipped under it, so five documents called built
      # adapters unbuilt on three separate days and every check passed. A factory registry and
      # a filesystem decide existence without reading a task id at all.
      - name: Denials match the tree, not just the ledger
        run: python scripts/check_unbuilt_claims.py

      # The sibling gates above all scan docs/ and none opens a .py file, so a docstring or
      # a `# TODO:` marker could cite a ticked, superseded or invented task and stay green —
      # which is how three rate-limit modules kept pointing at finished work. CI only: the
      # maintainer directed that doc gates stay out of pre-commit.
      - name: Task ids cited in code resolve
        run: python scripts/check_task_ids.py

      # ruff's E722 catches a bare `except:` and stops there, so until this gate nothing
      # checked the rule CLAUDE.md calls mandatory: that no exception is silently
      # swallowed. In a RAG pipeline a swallowed exception does not surface as an error, it
      # surfaces as a confident answer built from a silently shortened context. A code
      # gate, not a doc gate, so the maintainer's pre-commit exclusion for doc gates does
      # not apply. Measured at 1.67-1.83 s locally on Windows, interpreter start included.
      - name: Typed error taxonomy holds
        run: python scripts/check_error_taxonomy.py

      # ruff has no rule for "this comment is prose" and mypy never reads one, so until this
      # gate nothing checked CLAUDE.md's docstrings-only rule: a 2026-11-08 scan found 130
      # prose comment lines in 30 of src/'s 151 modules. Reasoning in a comment is reasoning
      # nobody greps and nothing keeps true; the same words in docs/code-notes.md show up in
      # a documentation diff. A code gate, not a doc gate, so the pre-commit exclusion does
      # not apply. Measured at 0.37-0.39 s locally on Windows, interpreter start included.
      - name: Only permitted comments exist
        run: python scripts/check_comments.py

      # The four mechanical places a version lives cannot be edited atomically by hand, and
      # a tree halfway through a stamp ships a wheel that contradicts its own README.
      - name: Version is coherent across the tree
        run: python scripts/stamp_release.py --check

      # `-rs` prints every skip with its reason. A test that skips on every platform is
      # indistinguishable from a test that does not exist, and the only way anyone found
      # that out before was by reading the progress dots character by character against a
      # local collection count (TASK-0328). Measured on run 42411261475: 7 of 3486 selected
      # tests skip here, and the same 7 skip on the windows job.
      - name: Unit tests
        run: pytest -m "not integration and not eval" -rs --cov --cov-report=term-missing

      # Scoped to the packages docs/testing-strategy.md gates, not the whole tree. A
      # repository-wide threshold is diluted by CLI plumbing and API wiring, so it can stay
      # green while the retrieval and adapter code it exists to protect regresses. Measured
      # at 87% branch coverage on 2026-08-02; the gate sits at 85 to leave working room
      # without letting it drift.
      - name: Coverage gate (core, adapters, workers)
        run: >
          pytest -m "not integration and not eval" -q
          --cov=src/fasterrag/core
          --cov=src/fasterrag/adapters
          --cov=src/fasterrag/workers
          --cov-report=
          --cov-fail-under=0

      # Chroma's contract suite is marked `integration` but is the only one that needs no
      # server and no daemon — it runs embedded against a temporary directory. Excluding it
      # would score a 515-statement adapter at 36% while 50 contract cases actually exercise
      # it, so the gate would measure the marker rather than the coverage. Appended here
      # rather than un-marking the suite, because it IS an integration test by intent.
      - name: Coverage gate (append Chroma's serverless contract suite)
        run: >
          pytest tests/integration/chroma -m integration -q
          --cov=src/fasterrag/core
          --cov=src/fasterrag/adapters
          --cov=src/fasterrag/workers
          --cov-append
          --cov-report=term
          --cov-fail-under=85

      # D10 dogfooded, and the packaged-template path with it: this is the only job that
      # exercises `config init` the way a `pip install` user does. The placeholder keys are
      # set so doctor gets past config validation and actually runs its environment checks —
      # without them it would exit 4 on the first one and the smoke test would pass
      # trivially. Exit 4 is still accepted afterwards, because CI has no Docker daemon and
      # a check *reporting* that is doctor working, not failing. A crash still fails the job.
      - name: Doctor smoke test
        env:
          FASTERRAG_API_KEY: ci-placeholder
          QDRANT_API_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
        run: |
          mkdir -p /tmp/doctor && cd /tmp/doctor
          fasterrag config init
          test -f config.yaml && test -f .env.example
          fasterrag doctor --json || [ $? -eq 4 ]

  # The project is developed on Windows and two shipped defects were Windows-only: a
  # path-case document id (`d:\` and `D:\` hashing differently, TASK-0141) and a UTF-8 BOM
  # rejected by the config loader. Both are invisible to an ubuntu-only matrix. Lint,
  # format, and typecheck are not repeated here — they are platform-independent and already
  # gate on the quality job.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `-rs` for the reason the quality job carries it: the two platforms' skip lists are
      # only comparable when both are printed (TASK-0328).
      - name: Unit tests
        run: pytest -m "not integration and not eval" -rs

  # The only job that exercises what a `pip install fasterrag` user actually receives.
  # Nothing else can: pytest puts src/ on sys.path, so the whole suite imports the checkout
  # and would stay green through a wheel that ships no `fasterrag.data/config.yaml`, no
  # console script, or a packages list that quietly drops a subpackage.
  #
  # Its own job rather than a step on quality, because it builds a wheel and a clean venv
  # (~95s measured locally on 2026-10-29) and that cost belongs beside the test run rather
  # than in front of it — on the push path either way, since a broken wheel is a release
  # blocker and finding it at tag time is finding it too late. Installing `.[dev]` rather
  # than bare `build` is deliberate: it also fails if `build` is ever dropped from the dev
  # extra, which is the defect that sent a releaser to a tool they did not have.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wheel installs and imports as a consumer gets it
        run: python scripts/check_package.py

  # security.md §6. Split from the quality job so a dependency advisory published overnight
  # does not read as "the tests broke".
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Scans full history, not the diff. A secret committed and later removed is still in
      # the history, and still compromised — checking only the tip would call it clean.
      #
      # That sentence stood here while the step did the opposite (TASK-0315). Measured on
      # run 41865567333: `gitleaks detect ... --log-opts=-1`, 1 commits scanned, ~3188
      # bytes, while the same action on security.yml's schedule scanned 290 commits and
      # 6.26 MB of the same SHA. `fetch-depth: 0` above was paid and thrown away. The cause
      # is in the action rather than in this file: gitleaks-action@v2 appends `--log-opts=-1`
      # when a push event's base and head refs match, and offers no override for it — its
      # only documented lever, BASE_REF, selects a RANGE (`--no-merges --first-parent
      # base^..head`), which is still not the history. Read in its src/gitleaks.js at tag v2
      # on 2026-11-08.
      #
      # So the comment could be corrected or the control could be. The control is corrected,
      # because the alternative leaves a full clone fetched for a scan that does not use it,
      # and leaves one secret-scan verdict that depends on which trigger fired — the two
      # disagreed on the same commit, which is how this was found. Scanning history on push
      # also catches the case the tip scan cannot: a multi-commit push whose middle commit
      # carries the credential.
      #
      # Running the binary rather than the action also pins it. The action resolves
      # "latest" at run time, so the rule set moves under the repository without a commit,
      # and a scan whose rules change silently cannot be reproduced from a SHA. The archive
      # is checksummed against the published gitleaks_8.30.1_checksums.txt before it runs.
      # `gitleaks git` is the command `detect` was deprecated in favour of in v8.19.0, and
      # with no --log-opts it walks the whole log, which is what security.yml's scheduled
      # run already does through the action.
      #
      # CRITICAL: this is now the same control implemented twice, here and in security.yml.
      # They must not be allowed to drift the way the dependency audit's two copies did —
      # the fix is one composite action under .github/actions/, as that audit now uses.
      - name: Secret scan
        uses: ./.github/actions/secret-scan

      # The action uploaded its SARIF; keeping that is the point of the step, since a

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The lockfile is the contract. `--check` resolves pyproject.toml and fails if the
      # result differs from uv.lock, so a dependency added without relocking is caught here
      # rather than discovered when two machines install different versions.
      - name: Lockfile is current
        run: uv lock --check

      # The audit itself, and the four accepted chromadb ignores with the review that
      # justifies them, live in .github/actions/dependency-audit. security.yml runs the
      # same action on the scheduled trigger. It was two copies until 2026-11-07, and the
      # copies drifted the day they diverged (TASK-0308).
      - name: Dependency audit
        uses: ./.github/actions/dependency-audit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `-rs` because this job's skip list is the largest in the repository and was invisible
      # until TASK-0328 counted it: on run 42411261475, 98 of 380 selected cases skipped, all
      # of them the Milvus (45) and Weaviate (53) contract suites. The job is green either
      # way, so the only thing distinguishing "two adapters verified" from "two adapters not
      # reached" is this line.
      - name: Adapter contract suite against real backends
        run: pytest -m integration -rs

  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rerank]"

      # `-rs` is load-bearing here rather than informational: docs/testing-strategy.md §1.11
      # says a green `pytest -m eval` with no credentials proves nothing about any provider,
      # and names pytest's own SKIPPED line as the record that makes it legible. Without
      # `-rs` that line is not printed and the record does not exist (TASK-0328).
      - name: Verify against real embedding and reranking models
        run: pytest -m eval -rs

  # The D7 retrieval regression gate (docs/testing-strategy.md §2 gate 6). Its own job
  # rather than a step on `models`: that job runs the eval-marked tests, while this one
  # builds a real collection in a real Qdrant with real embeddings and scores it, which is
  # a different environment and a different cost.
  #
  # Every setting below is pinned rather than inherited, and each one is a value the
  # committed baseline records field by field in tests/eval/datasets/handbook/baseline.json:
  #
  #   retrieval.rerank=false            the shipped default reranks, and the cross-encoder
  #                                     it names is a 2.2 GB download on every push. The
  #                                     baseline was measured without it, so this gate
  #                                     covers retrieval and fusion and NOT the reranker.
  #   retrieval.top_k=5                 the baseline measured recall@5.
  #   chunking.token_counter=estimate   `auto` uses the embedding model's tokenizer when it
  #                                     is cached on the machine and silently estimates
  #                                     when it is not, so chunk boundaries would depend on
  #                                     the runner's cache state. A gate has to chunk the
  #                                     same way every time.
  #
  # The collection is created by the ingest itself (the indexer sizes it from the first
  # batch), so there is no separate `index create` step to disagree with it.
  eval-gate:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.1
        ports:
          - 6333:6333
          - 6334:6334
    env:
      # Config validation fails fast on any env var a config key references, so the gate
      # needs these present before it can reach the eval at all. Placeholders: this job
      # scores retrieval against a local Qdrant and never calls an LLM.
      QDRANT_API_KEY: ci-placeholder
      FASTERRAG_API_KEY: ci-placeholder
      OPENAI_API_KEY: ci-placeholder
      GATE: >-
        --config config.yaml
        --set vector_db.mode=external
        --set chunking.token_counter=estimate
        --set retrieval.top_k=5
        --set retrieval.rerank=false
        --set eval.regression_gate=true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,huggingface]"

      # The image declares no HEALTHCHECK, so GitHub cannot wait on the service and the
      # first request would race its start-up.
      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:6333/readyz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Qdrant did not become ready within 120 seconds"
          exit 1

      - name: Build the collection the gate scores
        run: fasterrag $GATE ingest tests/eval/datasets/handbook/corpus --collection handbook

      # `--suite eval` exits 5 on anything the gate refuses, so the run is allowed to fail
      # and the verdict is read from the document rather than from the exit code: 5 alone
      # cannot tell "recall fell" from "nothing was comparable", and those need different
      # answers from a human.
      - name: Retrieval regression gate (D7)
        run: |
          set +e
          fasterrag $GATE --json benchmark --suite eval \
            --dataset tests/eval/datasets/handbook --collection handbook > gate.json
          code=$?
          set -e
          cat gate.json
          read_gate="import json,sys;g=(json.load(open('gate.json')).get('gate') or {})"
          verdict=$(python -c "${read_gate};print(g.get('verdict','crashed'))" || echo crashed)
          python -c "${read_gate};sys.stdout.writelines('  %s\n' % r for r in [*g.get('failures',[]),*g.get('obstacles',[])])" || true
          case "${verdict}" in
            within-tolerance)
              echo "the gate compared this build against the committed baseline and found no drop beyond tolerance" ;;
            regressed)
              echo "::error::retrieval quality fell beyond eval.recall_tolerance or eval.ndcg_tolerance against tests/eval/datasets/handbook/baseline.json"
              exit 1 ;;
            not-comparable)
              echo "::error::the gate compared nothing, so no regression was ruled out; re-record the baseline from the measured report printed above rather than relaxing the gate"
              exit 1 ;;
            *)
              echo "::error::fasterrag benchmark --suite eval exited ${code} without a verdict this gate defines"
              exit 1 ;;
          esac

  commit-messages:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Commit message rule
        run: |
          python scripts/check_commit_message.py \
            --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
