# Static analysis of the Python source with CodeQL (TASK-0460).
#
# Python only: it is the only language this repository ships, and `build-mode: none` is all
# Python needs, so the job compiles nothing and installs nothing. Findings land in the
# repository's code-scanning alerts rather than failing this job, which is the action's own
# behaviour; a finding is triaged there, not waived here.
#
# The image scan TASK-0460 also names is not in this file: it needs a built image, and the
# image is built only by release.yml.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:python"
