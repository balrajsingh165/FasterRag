name: Secret scan
description: Scan the repository's whole git history for committed secrets with a pinned gitleaks.

# CRITICAL: this exists because the control was implemented twice, in ci.yml and
# security.yml, and two copies of one gate drift — the dependency audit proved that when
# four accepted advisories were added to one copy and not the other, turning the scheduled
# run red every night. Edit the scan here and nowhere else.
#
# The pinned binary replaces gitleaks-action@v2, which appends `--log-opts=-1` on `push`
# and so scanned one commit while both workflows claimed to scan full history; on
# `schedule` the same action scanned 290 commits, so one control gave two verdicts for one
# SHA. The action also resolves gitleaks "latest" at run time, meaning the rule set moved
# under the repository without a commit and a scan could not be reproduced from a SHA.
# With no --log-opts, `gitleaks git` walks the whole log on every trigger. `gitleaks git`
# is the command `detect` was deprecated in favour of in v8.19.0. Both callers must set
# `fetch-depth: 0`, or there is no history here to scan.

inputs:
  version:
    description: The pinned gitleaks release to download and run.
    required: false
    default: "8.30.1"
  sha256:
    description: Checksum of that release's linux_x64 archive, from its published checksums file.
    required: false
    default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

runs:
  using: composite
  steps:
    - name: Scan the whole history
      id: scan
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.version }}
        GITLEAKS_SHA256: ${{ inputs.sha256 }}
      run: |
        archive="${RUNNER_TEMP}/gitleaks.tar.gz"
        curl -sSfL --retry 3 -o "${archive}" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
        tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
        "${RUNNER_TEMP}/gitleaks" git . -v --redact --no-banner \
          --report-format sarif --report-path "${RUNNER_TEMP}/gitleaks.sarif"

    # A redacted log line names the rule and the commit but not enough to triage from, so
    # the report is kept whenever the scan itself failed.
    - name: Keep the secret-scan report
      if: ${{ failure() && steps.scan.conclusion == 'failure' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: gitleaks-results-${{ github.job }}
        path: ${{ runner.temp }}/gitleaks.sarif
        if-no-files-found: ignore
